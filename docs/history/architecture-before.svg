  <path d="M 640 266 L 664 266" fill="none" stroke="#374151" stroke-width="1.25" stroke-dasharray="6 4"/>
  <path d="M 640 362 L 664 362" fill="none" stroke="#374151" stroke-width="1.25" stroke-dasharray="6 4"/>
  <path d="M 640 470 L 664 470" fill="none" stroke="#374151" stroke-width="1.25" stroke-dasharray="6 4"/>
