  <text x="672" y="362.0" text-anchor="start" dy="0.35em" font-size="14">flags</text>
  <path d="M 815 654 L 815 736 L 285 736 L 285 318 L 270 318" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="320" y="746" width="28" height="18" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="356" y="755.0" text-anchor="start" dy="0.35em" font-size="14">an act by a person</text>
  <path d="M 505 755 L 533 755" fill="none" stroke="#374151" stroke-width="1.25" stroke-dasharray="6 4"/>
  <text x="541" y="755.0" text-anchor="start" dy="0.35em" font-size="14">flags, jobs, and the definition read at intake</text>
</svg>
