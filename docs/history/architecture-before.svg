<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 776" width="960" height="776" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#111827">
  <title id="title">The architecture as it was first drawn, in the earlier words: 21 boxes and 28 arrows</title>
  <desc id="desc">The earlier picture of the same system, kept for comparison. A chain of thirteen boxes runs down the middle: the scientist's brief, interview, intake, frame, build, G1 readiness, experiment, the confirmatory tiers D3 and D4, review, assemble, G2 signature, the signed finding, and scorers with a sealed-world benchmark. On the left are the signed knowledge, which feeds frame and review, the factory definition, which feeds intake, and the improver. On the right are the development tiers D0 to D2, the compute targets, and the flag queue, curator and steward, through which flags from four stages return to the signed knowledge.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#374151"/>
    </marker>
    <marker id="arrow-back" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="0.5" refY="4" orient="auto">
      <path d="M 9 0 L 0 4 L 9 8 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="776" fill="#FFFFFF"/>
  <rect x="320" y="16" width="320" height="44" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.25"/>
  <text x="480.0" y="38.0" text-anchor="middle" dy="0.35em" font-size="14">Scientist: a brief in their own words</text>
  <path d="M 480 60 L 480 70" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="320" y="70" width="320" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="480.0" y="92.0" text-anchor="middle" dy="0.35em" font-size="14">Interview: four questions</text>
  <path d="M 480 114 L 480 124" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="320" y="124" width="320" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="480.0" y="146.0" text-anchor="middle" dy="0.35em" font-size="14">Intake: work order</text>
  <path d="M 480 168 L 480 178" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="320" y="178" width="320" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="480.0" y="191.0" text-anchor="middle" dy="0.35em" font-size="14">Frame: consult knowledge, read</text>
  <text x="480.0" y="209.0" text-anchor="middle" dy="0.35em" font-size="14">design fields, draft registration</text>
  <path d="M 480 222 L 480 232" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="320" y="232" width="320" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="480.0" y="254.0" text-anchor="middle" dy="0.35em" font-size="14">Build: method, planted worlds, rehearsals</text>
  <path d="M 480 276 L 480 286" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="320" y="286" width="320" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="480.0" y="299.0" text-anchor="middle" dy="0.35em" font-size="14">G1 readiness: a human freezes</text>
  <text x="480.0" y="317.0" text-anchor="middle" dy="0.35em" font-size="14">registration and code</text>
  <path d="M 480 330 L 480 340" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="320" y="340" width="320" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="480.0" y="362.0" text-anchor="middle" dy="0.35em" font-size="14">Experiment: the broker opens a look</text>
  <path d="M 480 384 L 480 394" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="320" y="394" width="320" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="480.0" y="407.0" text-anchor="middle" dy="0.35em" font-size="14">D3 D4: confirmatory tiers,</text>
  <text x="480.0" y="425.0" text-anchor="middle" dy="0.35em" font-size="14">one look per window</text>
  <path d="M 480 438 L 480 448" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="320" y="448" width="320" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="480.0" y="470.0" text-anchor="middle" dy="0.35em" font-size="14">Review: independent verdict</text>
  <path d="M 480 492 L 480 502" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="320" y="502" width="320" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="480.0" y="524.0" text-anchor="middle" dy="0.35em" font-size="14">Assemble: finding from receipts only</text>
  <path d="M 480 546 L 480 556" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="320" y="556" width="320" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="480.0" y="578.0" text-anchor="middle" dy="0.35em" font-size="14">G2 signature: the steward</text>
  <path d="M 480 600 L 480 610" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="320" y="610" width="320" height="44" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.25"/>
  <text x="480.0" y="623.0" text-anchor="middle" dy="0.35em" font-size="14">Signed finding, or a recorded</text>
  <text x="480.0" y="641.0" text-anchor="middle" dy="0.35em" font-size="14">negative result</text>
  <path d="M 480 654 L 480 664" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="320" y="664" width="320" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="480.0" y="686.0" text-anchor="middle" dy="0.35em" font-size="14">Scorers and sealed-world benchmark</text>
  <rect x="20" y="124" width="250" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="145.0" y="146.0" text-anchor="middle" dy="0.35em" font-size="14">Factory definition</text>
  <path d="M 270 146 L 320 146" fill="none" stroke="#374151" stroke-width="1.25" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="20" y="286" width="250" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="145.0" y="308.0" text-anchor="middle" dy="0.35em" font-size="14">Signed knowledge: OKF bundles</text>
  <path d="M 270 298 L 300 298 L 300 200 L 320 200" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 300 298 L 300 470 L 320 470" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="20" y="664" width="250" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="145.0" y="677.0" text-anchor="middle" dy="0.35em" font-size="14">Improver: proposals as pull</text>
  <text x="145.0" y="695.0" text-anchor="middle" dy="0.35em" font-size="14">requests, with a memory</text>
  <path d="M 320 686 L 270 686" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 20 686 L 8 686 L 8 146 L 20 146" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="690" y="232" width="250" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="815.0" y="245.0" text-anchor="middle" dy="0.35em" font-size="14">D0 D1 D2: development tiers,</text>
  <text x="815.0" y="263.0" text-anchor="middle" dy="0.35em" font-size="14">iterate freely</text>
  <path d="M 640 244 L 690 244" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <rect x="690" y="292" width="250" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="815.0" y="305.0" text-anchor="middle" dy="0.35em" font-size="14">Compute targets: local, cloud,</text>
  <text x="815.0" y="323.0" text-anchor="middle" dy="0.35em" font-size="14">HPC, MAAP later</text>
  <path d="M 780 276 L 780 292" fill="none" stroke="#374151" stroke-width="1.25" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <path d="M 640 416 L 860 416 L 860 336" fill="none" stroke="#374151" stroke-width="1.25" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="868" y="386.0" text-anchor="start" dy="0.35em" font-size="14">jobs</text>
  <rect x="690" y="502" width="250" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="815.0" y="524.0" text-anchor="middle" dy="0.35em" font-size="14">Flag queue</text>
  <rect x="690" y="556" width="250" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="815.0" y="578.0" text-anchor="middle" dy="0.35em" font-size="14">Curator: routes and drafts</text>
  <rect x="690" y="610" width="250" height="44" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.25"/>
  <text x="815.0" y="632.0" text-anchor="middle" dy="0.35em" font-size="14">Steward signs</text>
