<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#111827">
  <title id="title">Two ways of working, and the wall between them</title>
  <desc id="desc">On the left, exploring: read what is known; propose the fresh data from metadata and set it aside; look as often as wanted, every look logged; record choices and notes; write up a lead, which is reviewed. On the right, confirming: plan; test on known answers; the lock, by people; check once, on fresh data; review; the signature, by people. A wall stands between them. Two things cross it: a lead, handed over to start a plan, and the data kept unopened, which becomes the check and is opened once.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="680" fill="#FFFFFF"/>
  <text x="165.0" y="34.0" text-anchor="middle" dy="0.35em" font-size="16" font-weight="600">Exploring: most of the work</text>
  <text x="795.0" y="34.0" text-anchor="middle" dy="0.35em" font-size="16" font-weight="600">Confirming: one claim, stated first</text>
  <rect x="30" y="70" width="270" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="165.0" y="100.0" text-anchor="middle" dy="0.35em" font-size="14">Read what is known</text>
  <rect x="30" y="160" width="270" height="60" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="165.0" y="180.9" text-anchor="middle" dy="0.35em" font-size="14">Propose the fresh data from</text>
  <text x="165.0" y="199.1" text-anchor="middle" dy="0.35em" font-size="14">metadata, and set it aside</text>
  <path d="M 165 130 L 165 160" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="250" width="270" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="165.0" y="270.9" text-anchor="middle" dy="0.35em" font-size="14">Look, as often as you like;</text>
  <text x="165.0" y="289.1" text-anchor="middle" dy="0.35em" font-size="14">every look is logged</text>
  <path d="M 165 220 L 165 250" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="340" width="270" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="165.0" y="370.0" text-anchor="middle" dy="0.35em" font-size="14">Record choices and notes</text>
  <path d="M 165 310 L 165 340" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="430" width="270" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="165.0" y="450.9" text-anchor="middle" dy="0.35em" font-size="14">Write up a lead;</text>
  <text x="165.0" y="469.1" text-anchor="middle" dy="0.35em" font-size="14">it is reviewed</text>
  <path d="M 165 400 L 165 430" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="660" y="70" width="270" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="795.0" y="95.0" text-anchor="middle" dy="0.35em" font-size="14">Plan</text>
  <rect x="660" y="146" width="270" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="795.0" y="171.0" text-anchor="middle" dy="0.35em" font-size="14">Test on known answers</text>
  <path d="M 795 120 L 795 146" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="660" y="222" width="270" height="50" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="795.0" y="247.0" text-anchor="middle" dy="0.35em" font-size="14">The lock, by people</text>
  <path d="M 795 196 L 795 222" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="660" y="298" width="270" height="50" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="795.0" y="323.0" text-anchor="middle" dy="0.35em" font-size="14">Check once, on fresh data</text>
  <path d="M 795 272 L 795 298" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="660" y="374" width="270" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="795.0" y="399.0" text-anchor="middle" dy="0.35em" font-size="14">Review</text>
  <path d="M 795 348 L 795 374" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="660" y="450" width="270" height="50" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="795.0" y="475.0" text-anchor="middle" dy="0.35em" font-size="14">The signature, by people</text>
  <path d="M 795 424 L 795 450" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="475" y="60" width="10" height="560" fill="#374151"/>
  <path d="M 300 170 L 340 170 L 340 323 L 660 323" fill="none" stroke="#B91C1C" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="572.0" y="284.0" text-anchor="middle" dy="0.35em" font-size="14">kept unopened, it</text>
  <text x="572.0" y="304.0" text-anchor="middle" dy="0.35em" font-size="14">becomes the check</text>
  <path d="M 165 490 L 165 590 L 948 590 L 948 95 L 930 95" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="242.8" y="564.5" width="154.3" height="21.0" fill="#FFFFFF"/>
  <text x="320.0" y="575.0" text-anchor="middle" dy="0.35em" font-size="14">a lead, handed over</text>
  <text x="480.0" y="650.0" text-anchor="middle" dy="0.35em" font-size="14">Red: the fresh data. Amber: the two acts by people.</text>
</svg>
