<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#111827">
  <title id="title">The exploring loop</title>
  <desc id="desc">Five steps, top to bottom: read what is known, from knowledge only; propose the fresh data from metadata and set it aside, before any look; look as often as you like, every look logged; record choices and notes as you go; write up the lead and have it reviewed by someone who did none of the work. From the review the work goes back to looking, or the lead is handed over to a confirming study, or the exploration ends as a note, a method or a stop.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="620" fill="#FFFFFF"/>
  <rect x="230" y="40" width="420" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="440.0" y="62.9" text-anchor="middle" dy="0.35em" font-size="14">1. Read what is known</text>
  <text x="440.0" y="81.1" text-anchor="middle" dy="0.35em" font-size="14">(knowledge only, never data)</text>
  <rect x="230" y="140" width="420" height="64" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="440.0" y="162.9" text-anchor="middle" dy="0.35em" font-size="14">2. Propose the fresh data from metadata,</text>
  <text x="440.0" y="181.1" text-anchor="middle" dy="0.35em" font-size="14">and set it aside, before any look</text>
  <path d="M 440 104 L 440 140" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="230" y="240" width="420" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="440.0" y="262.9" text-anchor="middle" dy="0.35em" font-size="14">3. Look, as often as you like;</text>
  <text x="440.0" y="281.1" text-anchor="middle" dy="0.35em" font-size="14">every look is logged by checksum</text>
  <path d="M 440 204 L 440 240" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="230" y="340" width="420" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="440.0" y="362.9" text-anchor="middle" dy="0.35em" font-size="14">4. Record choices and notes</text>
  <text x="440.0" y="381.1" text-anchor="middle" dy="0.35em" font-size="14">as you go</text>
  <path d="M 440 304 L 440 340" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="230" y="440" width="420" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="440.0" y="462.9" text-anchor="middle" dy="0.35em" font-size="14">5. Write up the lead; someone who</text>
  <text x="440.0" y="481.1" text-anchor="middle" dy="0.35em" font-size="14">did none of the work reviews it</text>
  <path d="M 440 404 L 440 440" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 650 472 L 760 472 L 760 272 L 650 272" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="709.8" y="361.5" width="100.4" height="21.0" fill="#FFFFFF"/>
  <text x="760.0" y="372.0" text-anchor="middle" dy="0.35em" font-size="14">holes found:</text>
  <rect x="717.5" y="381.5" width="85.0" height="21.0" fill="#FFFFFF"/>
  <text x="760.0" y="392.0" text-anchor="middle" dy="0.35em" font-size="14">look again</text>
  <path d="M 440 504 L 440 548" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="250" y="548" width="380" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="440.0" y="573.0" text-anchor="middle" dy="0.35em" font-size="14">Hand the lead over, or stop</text>
</svg>
