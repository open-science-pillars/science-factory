<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#111827">
  <title id="title">Measure and improve, with the firewall</title>
  <desc id="desc">On the left, what is written before any opening of fresh data: the request, the plan, the known-answer tests, the log up to the lock, an exploration's log and lead. It feeds the judges and the checks, and what is marked for self-improvement may feed a proposal to change the definition, which a person adopts only after a pass on the acceptance set. On the right, in red, what an opening produced: its outcome, the finding, the log after it. It is counted by checks, shown to people and fed to the knowledge loop. A wall stands between it and every judge and every proposal; the validator refuses a judge that reads past it.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#FFFFFF"/>
  <rect x="30" y="40" width="400" height="110" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="230.0" y="76.8" text-anchor="middle" dy="0.35em" font-size="14">Written before any opening:</text>
  <text x="230.0" y="95.0" text-anchor="middle" dy="0.35em" font-size="14">the request, the plan, the tests,</text>
  <text x="230.0" y="113.2" text-anchor="middle" dy="0.35em" font-size="14">the log to the lock, a lead</text>
  <rect x="30" y="190" width="190" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="125.0" y="220.0" text-anchor="middle" dy="0.35em" font-size="14">Judges</text>
  <rect x="240" y="190" width="190" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="335.0" y="220.0" text-anchor="middle" dy="0.35em" font-size="14">Checks</text>
  <rect x="30" y="300" width="400" height="70" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="230.0" y="325.9" text-anchor="middle" dy="0.35em" font-size="14">A proposal to change the definition,</text>
  <text x="230.0" y="344.1" text-anchor="middle" dy="0.35em" font-size="14">as a pull request</text>
  <rect x="30" y="420" width="400" height="70" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="230.0" y="445.9" text-anchor="middle" dy="0.35em" font-size="14">A person adopts it, after a pass</text>
  <text x="230.0" y="464.1" text-anchor="middle" dy="0.35em" font-size="14">on the acceptance set</text>
  <path d="M 125 150 L 125 190" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 335 150 L 335 190" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 125 250 L 125 300" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 230 370 L 230 420" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="475" y="30" width="10" height="480" fill="#374151"/>
  <rect x="106.4" y="519.5" width="747.2" height="21.0" fill="#FFFFFF"/>
  <text x="480.0" y="530.0" text-anchor="middle" dy="0.35em" font-size="14">the firewall: no judge and no proposal reads past this line; the validator refuses one that does</text>
  <rect x="530" y="40" width="400" height="110" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="730.0" y="76.8" text-anchor="middle" dy="0.35em" font-size="14">Written from the first opening on:</text>
  <text x="730.0" y="95.0" text-anchor="middle" dy="0.35em" font-size="14">the outcome, the finding,</text>
  <text x="730.0" y="113.2" text-anchor="middle" dy="0.35em" font-size="14">the log after it</text>
  <rect x="530" y="210" width="400" height="70" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="730.0" y="235.9" text-anchor="middle" dy="0.35em" font-size="14">Counted by checks,</text>
  <text x="730.0" y="254.1" text-anchor="middle" dy="0.35em" font-size="14">and shown to people</text>
  <rect x="530" y="330" width="400" height="70" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="730.0" y="355.9" text-anchor="middle" dy="0.35em" font-size="14">Fed to the knowledge loop</text>
  <text x="730.0" y="374.1" text-anchor="middle" dy="0.35em" font-size="14">as notes and drafted pages</text>
  <path d="M 730 150 L 730 210" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 730 280 L 730 330" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
</svg>
