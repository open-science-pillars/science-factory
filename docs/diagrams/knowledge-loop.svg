<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#111827">
  <title id="title">The knowledge loop, as built</title>
  <desc id="desc">Before work, knowledge.py about lists the wiki pages that bear on the question. Work, exploring or confirming, raises notes. After the exploration ends or the study closes, the curating agent drafts pages from the notes into a queue of drafts, which knowledge.py check-drafts checks. A person reads each draft and accepts it into the wiki by pull request, where only a person's own verified line signs it. The next question finds it, as a draft or as signed.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" fill="#FFFFFF"/>
  <rect x="340" y="30" width="280" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="480.0" y="52.9" text-anchor="middle" dy="0.35em" font-size="14">The wiki (openwiki/):</text>
  <text x="480.0" y="71.1" text-anchor="middle" dy="0.35em" font-size="14">pages, signed by a person</text>
  <rect x="660" y="170" width="260" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="790.0" y="192.9" text-anchor="middle" dy="0.35em" font-size="14">Work: an exploration</text>
  <text x="790.0" y="211.1" text-anchor="middle" dy="0.35em" font-size="14">or a study raises notes</text>
  <rect x="340" y="310" width="280" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="480.0" y="332.9" text-anchor="middle" dy="0.35em" font-size="14">The curating agent drafts</text>
  <text x="480.0" y="351.1" text-anchor="middle" dy="0.35em" font-size="14">pages into a queue</text>
  <rect x="20" y="170" width="280" height="64" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="160.0" y="192.9" text-anchor="middle" dy="0.35em" font-size="14">A person accepts a draft</text>
  <text x="160.0" y="211.1" text-anchor="middle" dy="0.35em" font-size="14">into the wiki</text>
  <path d="M 620 62 L 790 62 L 790 170" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="760.0" y="40.0" text-anchor="middle" dy="0.35em" font-size="14">knowledge.py about, before work</text>
  <path d="M 790 234 L 790 342 L 620 342" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="800.0" y="290.0" text-anchor="start" dy="0.35em" font-size="14">notes</text>
  <path d="M 340 342 L 160 342 L 160 234" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="150.0" y="290.0" text-anchor="end" dy="0.35em" font-size="14">check-drafts</text>
  <path d="M 160 170 L 160 62 L 340 62" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="170.0" y="40.0" text-anchor="middle" dy="0.35em" font-size="14">by pull request</text>
</svg>
