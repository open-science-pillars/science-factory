<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#111827">
  <title id="title">How what is learned goes back into the shared knowledge</title>
  <desc id="desc">Any assistant, in the middle of its work, raises a note with a kind, a subject and evidence; it may also draft a page at once. Open notes and the traces of past work (study logs, transcripts, verdicts) go to the curating assistant, which is designed and not built; it keeps unsigned working memory and routes each note into a pull request. Sources the steward supplies go through the seeder into a pull request too. The steward, a person, reviews and signs, and only then is a page signed knowledge, which assistants read before their next work.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#374151"/>
    </marker>
    <marker id="arrow-back" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="0.5" refY="4" orient="auto">
      <path d="M 9 0 L 0 4 L 9 8 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="500" fill="#FFFFFF"/>
  <rect x="36" y="24" width="250" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="161.0" y="45.0" text-anchor="middle" dy="0.35em" font-size="14">Any assistant,</text>
  <text x="161.0" y="63.0" text-anchor="middle" dy="0.35em" font-size="14">in the middle of its work</text>
  <rect x="356" y="24" width="250" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="481.0" y="45.0" text-anchor="middle" dy="0.35em" font-size="14">Open notes:</text>
  <text x="481.0" y="63.0" text-anchor="middle" dy="0.35em" font-size="14">kind, subject, evidence</text>
  <rect x="676" y="24" width="250" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="801.0" y="45.0" text-anchor="middle" dy="0.35em" font-size="14">Curating assistant (designed):</text>
  <text x="801.0" y="63.0" text-anchor="middle" dy="0.35em" font-size="14">reads across studies</text>
  <rect x="356" y="134" width="250" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="481.0" y="155.0" text-anchor="middle" dy="0.35em" font-size="14">Traces: study logs,</text>
  <text x="481.0" y="173.0" text-anchor="middle" dy="0.35em" font-size="14">transcripts, verdicts</text>
  <rect x="676" y="134" width="250" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="801.0" y="155.0" text-anchor="middle" dy="0.35em" font-size="14">Working memory, unsigned:</text>
  <text x="801.0" y="173.0" text-anchor="middle" dy="0.35em" font-size="14">digests, open threads</text>
  <rect x="36" y="254" width="250" height="60" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.25"/>
  <text x="161.0" y="284.0" text-anchor="middle" dy="0.35em" font-size="14">Sources the steward supplies</text>
  <rect x="356" y="254" width="250" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="481.0" y="284.0" text-anchor="middle" dy="0.35em" font-size="14">Seeder: drafts from sources</text>
  <rect x="676" y="254" width="250" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="801.0" y="284.0" text-anchor="middle" dy="0.35em" font-size="14">Pull request</text>
  <rect x="36" y="364" width="250" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="161.0" y="385.0" text-anchor="middle" dy="0.35em" font-size="14">Signed knowledge:</text>
  <text x="161.0" y="403.0" text-anchor="middle" dy="0.35em" font-size="14">read before the next work</text>
  <rect x="356" y="364" width="250" height="60" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="481.0" y="394.0" text-anchor="middle" dy="0.35em" font-size="14">The steward reviews and signs</text>
  <path d="M 286 46 L 356 46" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 606 46 L 676 46" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 606 164 L 641 164 L 641 66 L 676 66" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 801 84 L 801 134" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <path d="M 926 54 L 946 54 L 946 284 L 926 284" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 286 284 L 356 284" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 606 284 L 676 284" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 100 84 L 100 226 L 736 226 L 736 254" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="112" y="212.0" text-anchor="start" dy="0.35em" font-size="14">a draft, at status draft</text>
  <path d="M 801 314 L 801 394 L 606 394" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 356 394 L 286 394" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 36 394 L 14 394 L 14 54 L 36 54" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="452" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="66" y="461.0" text-anchor="start" dy="0.35em" font-size="14">the factory's own parts</text>
  <rect x="245" y="452" width="28" height="18" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="281" y="461.0" text-anchor="start" dy="0.35em" font-size="14">an act by a person</text>
</svg>
