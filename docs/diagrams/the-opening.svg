<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1082" width="960" height="1082" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#111827">
  <title id="title">From the tests to the one opening of the held-out data, step by step</title>
  <desc id="desc">Fourteen steps from top to bottom, each with who acts. The analysis assistant fetches observation metadata only, then runs the known-answer tests, the working data and the rehearsals, as often as needed, and the study tool logs every attempt, running each command in a scratch copy behind a fence. The coordinating assistant writes the lock request, an evidence summary and a manifest of checksums, and opens a pull request. A required check on the platform says whether the manifest matches the files, whether somebody other than the author approved, and whether anything changed since the approval. The scientist and the steward, people, approve and merge the pull request on the protected branch: that merge is the lock. A job on the platform records the merge in the study log, where it stands as merge found, people not verified. The study tool then asks the platform who approved and records its answer, after which the lock stands as verified. The coordinating assistant asks the tool to open the held-out data. The study tool finds the merge with git, checks the manifest, the definition and what has already been opened, and asks the platform again: without its answer that people approved there is no opening. Then it fetches the planned window through the access gate, runs the locked code once, applies the planned rules, and answers supported, refuted or inconclusive. Beside steps 8 and 11 is the platform's own record of the pull request, which is what is asked.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="1082" fill="#FFFFFF"/>
  <rect x="30" y="20" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="37.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">1  Analysis assistant</text>
  <text x="380.0" y="55.0" text-anchor="middle" dy="0.35em" font-size="14">fetches observation metadata only</text>
  <path d="M 380 72 L 380 92" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="92" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="109.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">2  Analysis assistant</text>
  <text x="380.0" y="127.0" text-anchor="middle" dy="0.35em" font-size="14">runs known-answer tests, working data and rehearsals, as often as needed</text>
  <path d="M 380 144 L 380 164" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="164" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="181.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">3  Study tool</text>
  <text x="380.0" y="199.0" text-anchor="middle" dy="0.35em" font-size="14">answers pass or fail, and logs every attempt; each command runs in a scratch copy, fenced</text>
  <path d="M 380 216 L 380 236" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="236" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="253.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">4  Coordinating assistant</text>
  <text x="380.0" y="271.0" text-anchor="middle" dy="0.35em" font-size="14">writes the lock request (an evidence summary and a manifest) and opens a pull request</text>
  <path d="M 380 288 L 380 308" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="308" width="700" height="52" rx="6" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.25"/>
  <text x="380.0" y="325.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">5  The platform's required check</text>
  <text x="380.0" y="343.0" text-anchor="middle" dy="0.35em" font-size="14">manifest matches the files; approved by somebody other than the author; unchanged since</text>
  <path d="M 380 360 L 380 380" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="380" width="700" height="52" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="380.0" y="397.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">6  The scientist and the steward, people</text>
  <text x="380.0" y="415.0" text-anchor="middle" dy="0.35em" font-size="14">the lock: they approve and merge the pull request on the protected branch</text>
  <path d="M 380 432 L 380 452" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="452" width="700" height="52" rx="6" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.25"/>
  <text x="380.0" y="469.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">7  The platform's job after the merge</text>
  <text x="380.0" y="487.0" text-anchor="middle" dy="0.35em" font-size="14">records the merge in the study log: merge found, people not verified</text>
  <path d="M 380 504 L 380 524" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="524" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="541.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">8  Study tool, verifying the act</text>
  <text x="380.0" y="559.0" text-anchor="middle" dy="0.35em" font-size="14">asks the platform who approved and records its answer: verified</text>
  <path d="M 380 576 L 380 596" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="596" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="613.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">9  Coordinating assistant</text>
  <text x="380.0" y="631.0" text-anchor="middle" dy="0.35em" font-size="14">asks the study tool to open the held-out data</text>
  <path d="M 380 648 L 380 668" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="668" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="685.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">10  Study tool</text>
  <text x="380.0" y="703.0" text-anchor="middle" dy="0.35em" font-size="14">finds the merge with git; checks the manifest, the definition, and what has been opened</text>
  <path d="M 380 720 L 380 740" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="740" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="757.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">11  Study tool</text>
  <text x="380.0" y="775.0" text-anchor="middle" dy="0.35em" font-size="14">asks the platform again: without its answer that people approved, no opening</text>
  <path d="M 380 792 L 380 812" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="812" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="829.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">12  Study tool, as the access gate</text>
  <text x="380.0" y="847.0" text-anchor="middle" dy="0.35em" font-size="14">fetches the planned window, and nothing else</text>
  <path d="M 380 864 L 380 884" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="884" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="901.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">13  Study tool</text>
  <text x="380.0" y="919.0" text-anchor="middle" dy="0.35em" font-size="14">runs the locked code once and applies the planned rules</text>
  <path d="M 380 936 L 380 956" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="956" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="973.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">14  Study tool</text>
  <text x="380.0" y="991.0" text-anchor="middle" dy="0.35em" font-size="14">answers supported, refuted or inconclusive</text>
  <rect x="770" y="524" width="170" height="52" rx="6" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.25"/>
  <text x="855.0" y="541.0" text-anchor="middle" dy="0.35em" font-size="14">The platform's</text>
  <text x="855.0" y="559.0" text-anchor="middle" dy="0.35em" font-size="14">record</text>
  <path d="M 770 550 L 730 550" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="770" y="740" width="170" height="52" rx="6" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.25"/>
  <text x="855.0" y="757.0" text-anchor="middle" dy="0.35em" font-size="14">The platform's</text>
  <text x="855.0" y="775.0" text-anchor="middle" dy="0.35em" font-size="14">record</text>
  <path d="M 770 766 L 730 766" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="770" y="812" width="170" height="52" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="855.0" y="838.0" text-anchor="middle" dy="0.35em" font-size="14">Held-out data</text>
  <path d="M 770 838 L 730 838" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="1032" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="66" y="1041.0" text-anchor="start" dy="0.35em" font-size="14">the factory's own parts</text>
  <rect x="245" y="1032" width="28" height="18" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="281" y="1041.0" text-anchor="start" dy="0.35em" font-size="14">an act by people</text>
  <rect x="415" y="1032" width="28" height="18" rx="4" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.25"/>
  <text x="451" y="1041.0" text-anchor="start" dy="0.35em" font-size="14">the platform, where people sign in</text>
  <rect x="700" y="1032" width="28" height="18" rx="4" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="736" y="1041.0" text-anchor="start" dy="0.35em" font-size="14">held-out data</text>
</svg>
