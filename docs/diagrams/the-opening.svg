<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#111827">
  <title id="title">From the tests to the one opening of the held-out data, step by step</title>
  <desc id="desc">Nine steps from top to bottom, each with who acts. The analysis assistant fetches observation metadata only, then runs the known-answer tests, the working data and the rehearsals, as often as needed, and the study tool logs every attempt. The steward, a person, locks the plan, the code and the receipts by checksum, citing an approving review, and the lock is committed and merged. The coordinating assistant asks the tool to open the held-out data. The study tool checks the locked plan and code and what has already been opened, fetches the planned window through the access gate, runs the locked code once, applies the planned rules, and answers supported, refuted or inconclusive.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#374151"/>
    </marker>
    <marker id="arrow-back" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="0.5" refY="4" orient="auto">
      <path d="M 9 0 L 0 4 L 9 8 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="700" fill="#FFFFFF"/>
  <rect x="30" y="20" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="37.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">1  Analysis assistant</text>
  <text x="380.0" y="55.0" text-anchor="middle" dy="0.35em" font-size="14">fetches observation metadata only</text>
  <path d="M 380 72 L 380 92" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="92" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="109.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">2  Analysis assistant</text>
  <text x="380.0" y="127.0" text-anchor="middle" dy="0.35em" font-size="14">runs known-answer tests, working data and rehearsals, as often as needed</text>
  <path d="M 380 144 L 380 164" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="164" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="181.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">3  Study tool</text>
  <text x="380.0" y="199.0" text-anchor="middle" dy="0.35em" font-size="14">answers pass or fail, and logs every attempt</text>
  <path d="M 380 216 L 380 236" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="236" width="700" height="52" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="380.0" y="253.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">4  The steward, a person</text>
  <text x="380.0" y="271.0" text-anchor="middle" dy="0.35em" font-size="14">the lock: plan, code and receipts by checksum; cites the approving review; committed, merged</text>
  <path d="M 380 288 L 380 308" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="308" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="325.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">5  Coordinating assistant</text>
  <text x="380.0" y="343.0" text-anchor="middle" dy="0.35em" font-size="14">asks the study tool to open the held-out data</text>
  <path d="M 380 360 L 380 380" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="380" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="397.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">6  Study tool</text>
  <text x="380.0" y="415.0" text-anchor="middle" dy="0.35em" font-size="14">checks the locked plan and code, the openings allowed, and what has been opened</text>
  <path d="M 380 432 L 380 452" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="452" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="469.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">7  Study tool, as the access gate</text>
  <text x="380.0" y="487.0" text-anchor="middle" dy="0.35em" font-size="14">fetches the planned window, and nothing else</text>
  <path d="M 380 504 L 380 524" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="524" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="541.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">8  Study tool</text>
  <text x="380.0" y="559.0" text-anchor="middle" dy="0.35em" font-size="14">runs the locked code once and applies the planned rules</text>
  <path d="M 380 576 L 380 596" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="596" width="700" height="52" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="380.0" y="613.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">9  Study tool</text>
  <text x="380.0" y="631.0" text-anchor="middle" dy="0.35em" font-size="14">answers supported, refuted or inconclusive</text>
  <rect x="770" y="452" width="170" height="52" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="855.0" y="478.0" text-anchor="middle" dy="0.35em" font-size="14">Held-out data</text>
  <path d="M 770 478 L 730 478" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="672" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="66" y="681.0" text-anchor="start" dy="0.35em" font-size="14">the factory's own parts</text>
  <rect x="245" y="672" width="28" height="18" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="281" y="681.0" text-anchor="start" dy="0.35em" font-size="14">an act by a person</text>
  <rect x="430" y="672" width="28" height="18" rx="4" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="466" y="681.0" text-anchor="start" dy="0.35em" font-size="14">held-out data</text>
</svg>
