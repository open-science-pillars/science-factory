<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#111827">
  <title id="title">The definition tree</title>
  <desc id="desc">The folder factory/, rooted at factory.yaml. Beside it: agents, one folder each with agent.md and its own skills; shared skills; harnesses (Claude Code, by hand, GitHub); runners; scorers (checks and judges); benchmarks; automations; templates; checkers.yaml; and change-log.jsonl.</desc>
