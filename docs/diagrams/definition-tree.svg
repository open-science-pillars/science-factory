    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#FFFFFF"/>
  <rect x="360" y="24" width="240" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="480.0" y="49.0" text-anchor="middle" dy="0.35em" font-size="14" font-weight="600">factory/factory.yaml</text>
