<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#111827">
  <title id="title">The confirming loop</title>
  <desc id="desc">The definition, factory/, sets the stages and who does each. Nine steps run from left to right and down: ask, plan, test on known answers, the lock by people, check once on fresh data, review, the signature by people, learn, close. Agents do the labor of the stages in blue. The two acts in amber are pull requests people approve and merge on GitHub. The fresh data, in red, is opened once, by the tool, after the lock. The study log records every step.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="#FFFFFF"/>
  <rect x="250" y="24" width="460" height="54" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="480.0" y="41.9" text-anchor="middle" dy="0.35em" font-size="14">The definition (factory/): the stages,</text>
  <text x="480.0" y="60.1" text-anchor="middle" dy="0.35em" font-size="14">who does each, and what ends each</text>
  <rect x="40" y="140" width="190" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="135.0" y="172.0" text-anchor="middle" dy="0.35em" font-size="14">1. Ask</text>
  <rect x="270" y="140" width="190" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="365.0" y="162.9" text-anchor="middle" dy="0.35em" font-size="14">2. Plan, and propose</text>
  <text x="365.0" y="181.1" text-anchor="middle" dy="0.35em" font-size="14">the fresh data</text>
  <path d="M 230 172 L 270 172" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="500" y="140" width="190" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="595.0" y="162.9" text-anchor="middle" dy="0.35em" font-size="14">3. Test on</text>
  <text x="595.0" y="181.1" text-anchor="middle" dy="0.35em" font-size="14">known answers</text>
  <path d="M 460 172 L 500 172" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="730" y="140" width="190" height="64" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="825.0" y="162.9" text-anchor="middle" dy="0.35em" font-size="14">The lock,</text>
  <text x="825.0" y="181.1" text-anchor="middle" dy="0.35em" font-size="14">by people</text>
  <path d="M 690 172 L 730 172" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="730" y="290" width="190" height="64" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="825.0" y="312.9" text-anchor="middle" dy="0.35em" font-size="14">4. Check once,</text>
  <text x="825.0" y="331.1" text-anchor="middle" dy="0.35em" font-size="14">on fresh data</text>
  <rect x="500" y="290" width="190" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="595.0" y="322.0" text-anchor="middle" dy="0.35em" font-size="14">5. Review</text>
  <path d="M 730 322 L 690 322" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="270" y="290" width="190" height="64" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="365.0" y="312.9" text-anchor="middle" dy="0.35em" font-size="14">The signature,</text>
  <text x="365.0" y="331.1" text-anchor="middle" dy="0.35em" font-size="14">by people</text>
  <path d="M 500 322 L 460 322" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="40" y="290" width="190" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="135.0" y="312.9" text-anchor="middle" dy="0.35em" font-size="14">Learn,</text>
  <text x="135.0" y="331.1" text-anchor="middle" dy="0.35em" font-size="14">then close</text>
  <path d="M 270 322 L 230 322" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 825 204 L 825 290" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M 480 78 L 480 110 L 135 110 L 135 140" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="268.2" y="99.5" width="123.5" height="21.0" fill="#FFFFFF"/>
  <text x="330.0" y="110.0" text-anchor="middle" dy="0.35em" font-size="14">sets the stages</text>
  <rect x="40" y="420" width="280" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="180.0" y="440.9" text-anchor="middle" dy="0.35em" font-size="14">Agents do the labor, four</text>
  <text x="180.0" y="459.1" text-anchor="middle" dy="0.35em" font-size="14">of them, each from its file</text>
  <rect x="340" y="420" width="280" height="60" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
  <text x="480.0" y="440.9" text-anchor="middle" dy="0.35em" font-size="14">People make the two acts:</text>
  <text x="480.0" y="459.1" text-anchor="middle" dy="0.35em" font-size="14">pull requests on GitHub</text>
  <rect x="640" y="420" width="280" height="60" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.25"/>
  <text x="780.0" y="440.9" text-anchor="middle" dy="0.35em" font-size="14">The fresh data is opened</text>
  <text x="780.0" y="459.1" text-anchor="middle" dy="0.35em" font-size="14">once, by the tool</text>
  <text x="480.0" y="385.0" text-anchor="middle" dy="0.35em" font-size="14">Every step is written to the study log, which is only ever added to.</text>
</svg>
