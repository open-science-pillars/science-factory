<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 934" width="960" height="934" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#111827">
  <title id="title">The layout of the repository</title>
  <desc id="desc">The top folder holds seven groups of folders. tools: the programs a person or an assistant runs, among them the validator of the definition, the study tool, the exploring tool, the scorers tool and the benchmark tool. factory: the definition of this factory as code, a tree of files rooted at factory.yaml, with nine parts drawn under it: factory.yaml (the schema version, the procedure, the two acts by people); agents, one folder for each agent with its agent.md and its own skills; skills that two or more agents share; harnesses, which start an agent; runners, where a job computes; scorers, which are checks a tool works out and rubrics for a model judge; benchmarks, the blind test suites in a design set and an acceptance set; automations, declared and not wired; and templates, pinned checkers and the change log. methods: the built-in method, the gain of one record against another, and a pairing step. compute: the contract any runner must keep. openwiki: this repository's own knowledge base. examples: inputs and recipes, one that runs from a bare clone and one optional demo. docs: how to define a factory, the design, the plan, the word list and the reviews. Below them, drawn apart with dashed outlines because neither is kept in this repository: a run, which every example makes fresh in a scratch folder; and your own studies and explorations, which live in the repository where the science is, beside a factory folder of its own.</desc>
