<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#111827">
  <title id="title">The layout of the repository</title>
  <desc id="desc">The top folder holds eight groups of folders, all parts of the factory. tools: the programs a person or an assistant runs. factory: the definition of this factory as files. methods: the built-in method, the gain of one record against another, and a pairing step. compute: the contract for where a job runs. assistants, skills and runners: the roles as files, their skills and what starts a role. openwiki: this repository's own knowledge base. examples: inputs and recipes, one that runs from a bare clone and one optional demo. docs: the design, the plan, the word list and the reviews. Below them, drawn apart with dashed outlines because neither is kept in this repository: a run, which every example makes fresh in a scratch folder; and your own studies and explorations, which live in the repository where the science is.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="640" fill="#FFFFFF"/>
  <rect x="30" y="20" width="210" height="40" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.25"/>
  <text x="135.0" y="40.0" text-anchor="middle" dy="0.35em" font-size="14">science-factory/</text>
  <rect x="80" y="82" width="250" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="205.0" y="101.0" text-anchor="middle" dy="0.35em" font-size="14">tools/</text>
  <path d="M 50 60 L 50 101 L 80 101" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="346" y="101.0" text-anchor="start" dy="0.35em" font-size="14">the programs you run: the study tool (sf.py), the exploring tool, the knowledge helpers</text>
  <rect x="80" y="134" width="250" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="205.0" y="153.0" text-anchor="middle" dy="0.35em" font-size="14">factory/</text>
  <path d="M 50 101 L 50 153 L 80 153" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="346" y="153.0" text-anchor="start" dy="0.35em" font-size="14">this factory, as files: the procedure, its change log, the templates</text>
  <rect x="80" y="186" width="250" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="205.0" y="205.0" text-anchor="middle" dy="0.35em" font-size="14">methods/</text>
  <path d="M 50 153 L 50 205 L 80 205" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="346" y="205.0" text-anchor="start" dy="0.35em" font-size="14">the built-in method: the gain of one record against another, and a pairing step</text>
  <rect x="80" y="238" width="250" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="205.0" y="257.0" text-anchor="middle" dy="0.35em" font-size="14">compute/</text>
  <path d="M 50 205 L 50 257 L 80 257" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="346" y="257.0" text-anchor="start" dy="0.35em" font-size="14">the contract for where a job runs, and the table of places</text>
  <rect x="80" y="290" width="250" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="205.0" y="309.0" text-anchor="middle" dy="0.35em" font-size="14">assistants/  skills/  runners/</text>
  <path d="M 50 257 L 50 309 L 80 309" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="346" y="309.0" text-anchor="start" dy="0.35em" font-size="14">the four roles as files, their skills, and what starts a role</text>
  <rect x="80" y="342" width="250" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="205.0" y="361.0" text-anchor="middle" dy="0.35em" font-size="14">openwiki/</text>
  <path d="M 50 309 L 50 361 L 80 361" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="346" y="361.0" text-anchor="start" dy="0.35em" font-size="14">this repository's own knowledge base: a wiki of Markdown pages</text>
  <rect x="80" y="394" width="250" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="205.0" y="413.0" text-anchor="middle" dy="0.35em" font-size="14">examples/</text>
  <path d="M 50 361 L 50 413 L 80 413" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="346" y="413.0" text-anchor="start" dy="0.35em" font-size="14">inputs and recipes: one that runs from a bare clone; one optional demo</text>
  <rect x="80" y="446" width="250" height="38" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.25"/>
  <text x="205.0" y="465.0" text-anchor="middle" dy="0.35em" font-size="14">docs/</text>
  <path d="M 50 413 L 50 465 L 80 465" fill="none" stroke="#374151" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="346" y="465.0" text-anchor="start" dy="0.35em" font-size="14">the design, the build plan, the word list, proposals, reviews, diagrams</text>
  <path d="M 30 506 L 930 506" fill="none" stroke="#374151" stroke-width="1.25"/>
  <text x="30" y="528" text-anchor="start" dy="0.35em" font-size="14">Not kept in this repository (dashed outline):</text>
  <rect x="80" y="548" width="250" height="38" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.25" stroke-dasharray="6 4"/>
  <text x="205.0" y="567.0" text-anchor="middle" dy="0.35em" font-size="14">a run, made fresh</text>
  <text x="346" y="567.0" text-anchor="start" dy="0.35em" font-size="14">every example writes its run into a scratch folder outside the repository</text>
  <rect x="80" y="594" width="250" height="38" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.25" stroke-dasharray="6 4"/>
  <text x="205.0" y="613.0" text-anchor="middle" dy="0.35em" font-size="14">your own studies</text>
  <text x="346" y="613.0" text-anchor="start" dy="0.35em" font-size="14">studies/ and explorations/ live in the repository where the science is</text>
</svg>
