name: checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  core:
    # Everything here runs from this repository alone: no other repository is checked out beside it, and no
    # kept record is read, because none is kept. Every run these steps check is made fresh by the step itself.
    name: from this repository alone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The definition first: if the tree under factory/ is not valid, nothing below means what it says. The
      # validator has three results, and `not validated` (exit 2) fails this step like `invalid` does.
      - name: The factory's definition is valid
        run: uv run tools/check_factory.py
      - name: The validator tests itself, each rule with a definition that breaks it
        run: uv run tools/check_factory.py --selftest
      - name: What this change does to the definition, in plain words
        # Against the commit before this one. A first commit, or an earlier commit with no definition tree, is said
        # in words by the tool and is no failure.
        run: |
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            uv run tools/check_factory.py --summary git:HEAD^:factory factory | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no earlier commit in this checkout to compare with"
          fi
      # The judges: everything up to the point where a model is asked, and back from it. The self-test builds a
      # study that has been opened and checks that a judging packet holds nothing written after the opening.
      - name: The scorers tool tests itself, the outcome firewall and the judges' packets included
        run: uv run tools/scorers.py selftest
      - name: The study tool tests itself
        run: uv run tools/sf.py selftest
      - name: The pairing step of this repository's own tests itself
        run: uv run methods/built-in-pairing/pair_records.py --selftest
      - name: The plan of the system trial that runs from this repository alone is complete
        run: uv run tools/sf.py check-plan --study examples/stand-alone/system-trial
      - name: A short blind test of the system, on the built-in pairing step
        run: uv run methods/gain/system_trial.py blind-test --template examples/stand-alone/system-trial --n 20
      # The blind test as a benchmark: the shipped design suite, six sealed cases twice each under two configurations
      # of the definition (the current one, and the current one again), compared by the rule the suite states. The
      # expected answer is `no difference beyond noise`; `not comparable` (exit 2) fails the step. The acceptance
      # suite is not run here: its cases come from a seed that is not in the repository.
      - name: The benchmark tool tests itself (the arithmetic, the acceptance cases, the refusals)
        run: uv run tools/benchmark.py selftest
      - name: The small benchmark suite, the definition against itself
        run: uv run tools/benchmark.py run --suite factory/benchmarks/built-in-gain
      - name: The local runner passes the compute contract
        run: uv run compute/adapter.py conformance
      - name: The conformance test fails every deliberately wrong runner
        run: uv run compute/adapter.py conformance --self-check
      # The self-tests below include every attack an independent reviewer made on these tools (docs/reviews/README.md, R1 to
      # R3). The GitHub harness's verification asks no platform here: it runs on answers written by hand, and its one call on
      # this machine's loopback address. The exploring tool's tests of the kernel fence run with it where the runner's kernel
      # has Landlock, and all of them also run with it switched off. The knowledge helpers' self-test checks that
      # factory/checkers.yaml parses; the one checker pinned there belongs to another repository and is run only by the
      # optional demo (demo-with-hydrology.yml), never here.
      # check_roles.py also parses every command the role files, the skills and AGENTS.md show, under each tool's own
      # options as they are now, so a skill cannot drift from the tool it tells an agent to run.
      - name: The exploring tool, the fresh-data tool, the knowledge helpers and the checks
        run: |
          uv run tools/explore.py selftest
          uv run tools/knowledge.py selftest
          uv run tools/wiki_server.py --selftest
          uv run tools/fresh_data.py selftest
          uv run tools/check_roles.py
          uv run tools/check_roles.py --selftest
          uv run factory/harnesses/claude-code/render.py --check
          uv run factory/harnesses/claude-code/render.py --selftest
          uv run factory/harnesses/claude-code/allow.py --selftest
          uv run factory/harnesses/claude-code/run_role.py --selftest
          uv run factory/harnesses/by-hand/as_role.py --selftest
          uv run factory/harnesses/github/verify_request.py --selftest
          uv run factory/harnesses/github/record_act.py --selftest
          uv run factory/harnesses/github/verify_acts.py --selftest
          uv run factory/agents/analysis/skills/explore-a-record/scripts/describe_record.py --selftest
          uv run factory/agents/analysis/skills/explore-a-record/scripts/plot_xy.py --selftest
      # The self-tests above include each fault the first real run found (F1 to F19 of definition 0.14.0): a release set aside
      # binding the data as it stands, a long series described from its date column, and the rest.
      # The example also shows, in practice mode, a fit note, the overclaiming check, a person's so what, figures at the lock, a
      # look promoted to a method in a scratch copy of the definition, and a contribution statement.
      - name: The stand-alone example, end to end (both loops, then a study taken to a lock request and a practice lock), in a scratch folder
        run: uv run examples/stand-alone/run.py
      - name: The example left nothing in the repository
        run: test -z "$(git status --porcelain)"
      - name: The stand-alone example again, with a setting that makes the launcher warn on standard error
        # uv prints a deprecation warning for this variable on every call; the example once read that warning as part of
        # a tool's answer and crashed. One of its own steps tests the same thing without depending on the launcher.
        env:
          UV_NATIVE_TLS: "true"
        run: uv run examples/stand-alone/run.py
      - name: The stand-alone example again, with that setting set and empty, started by a Python that uv made
        # uv refuses a setting of its own that is set and empty before it runs anything, so `uv run` cannot start the
        # example here; the example and the tools give uv an environment without such a setting (found by the first real run).
        run: |
          uv venv "$RUNNER_TEMP/py" && uv pip install --python "$RUNNER_TEMP/py/bin/python" pyyaml
          UV_NATIVE_TLS= "$RUNNER_TEMP/py/bin/python" examples/stand-alone/run.py --remove
