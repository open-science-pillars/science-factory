name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    # Everything here runs from this repository alone: no other repository is checked out beside it.
    name: from this repository alone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: The study tool tests itself
        run: uv run tools/sf.py selftest
      - name: The pairing step of this repository's own tests itself
        run: uv run methods/built-in-pairing/pair_records.py --selftest
      - name: The plan of the system trial that runs from this repository alone is complete
        run: uv run tools/sf.py check-plan --study examples/stand-alone/system-trial
      - name: A short blind test of the system, on the built-in pairing step
        run: uv run methods/gain/system_trial.py blind-test --template examples/stand-alone/system-trial --n 20
      - name: The table of moved files is borne out by the files, and the one record that can be replayed without the checkouts says what it said
        run: |
          uv run tools/check_old_records.py
          uv run tools/check_old_records.py --selftest
      - name: The local place passes the compute contract
        run: uv run compute/adapter.py conformance
      - name: The conformance test fails every deliberately wrong place
        run: uv run compute/adapter.py conformance --self-check
      - name: The exploring tool, the knowledge helpers and the checks
        run: |
          uv run tools/explore.py selftest
          uv run tools/knowledge.py selftest
          uv run tools/wiki_server.py --selftest
          uv run tools/check_roles.py
          uv run tools/check_roles.py --selftest
          uv run runners/claude-code/render.py --check
          uv run runners/claude-code/render.py --selftest
          uv run runners/claude-code/allow.py --selftest
          uv run runners/claude-code/run_role.py --selftest
          uv run runners/by-hand/as_role.py --selftest
          uv run skills/explore-a-record/scripts/describe_record.py --selftest
          uv run skills/explore-a-record/scripts/plot_xy.py --selftest
      - name: The stand-alone example, end to end
        run: uv run examples/stand-alone/run.py
      - name: The stand-alone example again, with a setting that makes the launcher warn on standard error
        # uv prints a deprecation warning for this variable on every call; the example once read that warning as part of
        # a tool's answer and crashed. One of its own steps tests the same thing without depending on the launcher.
        env:
          UV_NATIVE_TLS: "true"
        run: uv run examples/stand-alone/run.py

  with-hydrology:
    # The checks that use the hydrology capability's own pairing script, its knowledge and the organization's
    # checker. They prove what they proved before the built-in pairing step existed: nothing here was made
    # to pass by it.
    name: with the hydrology capability beside it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The analysis plans find the checkouts beside the package by relative
      # path, so the three repositories sit side by side.
      - uses: actions/checkout@v4
        with:
          path: science-factory
      - uses: actions/checkout@v4
        with:
          repository: open-science-pillars/hydrology
          ref: f9850d08c526139407eedf13ee3f12effbe83594
          path: hydrology
      - uses: actions/checkout@v4
        with:
          repository: open-science-pillars/nasa-daac-knowledge
          ref: c04ae2e156ca8672c7724254a2c738bd252e9de6
          path: nasa-daac-knowledge
      - uses: astral-sh/setup-uv@v5
      - name: Both analysis plans are complete
        run: |
          uv run science-factory/tools/sf.py check-plan --study science-factory/studies/STUDY-0000
          uv run science-factory/tools/sf.py check-plan --study science-factory/studies/STUDY-0001
      - name: A short blind test of the system, on the hydrology capability's pairing script
        run: uv run science-factory/methods/gain/system_trial.py blind-test --template science-factory/studies/STUDY-0000 --n 20
      - name: The records made before the layout changed still say what they said, to the study tool that made them
        run: uv run science-factory/tools/check_old_records.py
      - name: On ten test cases the built-in pairing step and the hydrology script give the same pairs and scores
        run: uv run science-factory/methods/built-in-pairing/pair_records.py --selftest --compare-with hydrology/skills/swot-hydro/scripts/load_swot_confrontation.py
      - name: The knowledge helpers test themselves, with the organization's checker
        run: uv run science-factory/tools/knowledge.py selftest --checker nasa-daac-knowledge/tools/check_okf_v02.py
      - name: The demo's drafted knowledge, from both runs, still passes the queue's rules and the organization's checker
        run: |
          uv run science-factory/tools/knowledge.py check-drafts --queue science-factory/examples/baton-rouge/with-assistants/knowledge-queue --wiki hydrology/knowledge --checker nasa-daac-knowledge/tools/check_okf_v02.py
          uv run science-factory/tools/knowledge.py check-drafts --queue science-factory/examples/baton-rouge/knowledge-queue --wiki hydrology/knowledge --checker nasa-daac-knowledge/tools/check_okf_v02.py
      - name: The demo's exploration logs, from both runs, still check out on the tool as it now is
        run: |
          uv run science-factory/tools/explore.py check-log --exploration science-factory/examples/baton-rouge/with-assistants/explorations/EXPLORATION-0101
          uv run science-factory/tools/explore.py check-log --exploration science-factory/examples/baton-rouge/with-assistants/explorations/EXPLORATION-0102
          uv run science-factory/tools/explore.py check-log --exploration science-factory/examples/baton-rouge/explorations/EXPLORATION-0001
          uv run science-factory/tools/explore.py check-log --exploration science-factory/examples/baton-rouge/explorations/EXPLORATION-0002
