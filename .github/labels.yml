# The labels this repository uses, for a person to create once (factory/harnesses/github/README.md has the command). GitHub does
# not read this file by itself. A study's stage is a label on its tracking issue; the other labels sort the rest.
- name: "stage: ask"
  color: "1D4ED8"
  description: "A request, before the study starts"
- name: "stage: plan"
  color: "1D4ED8"
  description: "The analysis agent is writing the plan and proposing the fresh data"
- name: "stage: test"
  color: "1D4ED8"
  description: "Known-answer tests, working data and rehearsals"
- name: "stage: lock"
  color: "B45309"
  description: "Waiting on people: the lock request is a pull request to approve"
- name: "stage: open"
  color: "B91C1C"
  description: "The fresh data is opened, once"
- name: "stage: review"
  color: "1D4ED8"
  description: "The finding is written and the review agent checks it"
- name: "stage: signature"
  color: "B45309"
  description: "Waiting on people: the signature request is a pull request to approve"
- name: "stage: learn"
  color: "1D4ED8"
  description: "Notes are curated and the scorecard filed"
- name: "stage: closed"
  color: "374151"
  description: "The study is closed with its outcome"
- name: "exploring"
  color: "DBEAFE"
  description: "An exploration: ends in a lead, never a finding"
- name: "hole"
  color: "FEE2E2"
  description: "A hole a review or an attack found"
- name: "not built"
  color: "F3F4F6"
  description: "Something the documents name and no tool does yet"
- name: "owed"
  color: "FEF3C7"
  description: "A run or a review that is owed"
- name: "decision"
  color: "FEF3C7"
  description: "A decision for the steward or the owner; closed by the comment that decides"
- name: "knowledge"
  color: "DBEAFE"
  description: "A page accepted from the queue of drafts into the wiki"
- name: "data-release"
  color: "FEE2E2"
  description: "A new release of data: an automation may open a request for it"
