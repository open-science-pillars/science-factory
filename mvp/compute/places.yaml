# Where it runs: the places a factory's jobs can run, and how each would keep
# the one contract in compute/adapter.py (a job spec, four verbs, markers and a
# run log; the docstring there is the contract).
#
# Only the local place is built. A place is `built` when
# `adapter.py conformance --place REF` passes against it. For the other three
# nothing here has been run: a mapping is what an adapter is meant to do,
# written down before anyone writes one, and it stays a claim until conformance
# passes. Nothing in the study tool sends a job to any place yet, so `for` says
# what a place is meant for, not what runs there today.
#
# One table, the same twelve keys for every place. A cell is either a mapping
# (how this place does it) or the words "open question". Whatever is not
# settled, in an open cell or inside a mapping, is spelled out under the
# place's open_questions.
#
# The job spec is meant to be the same everywhere, and so is the run receipt a
# job writes (the record a run writes, with its code and inputs by checksum and
# every number it produced); only the run log differs. Where a place cannot run
# a spec's argv as given, its argv cell says so.

keys:
  submit: "how a job spec becomes a job at this place"
  idempotency: "how the same key is the same job, how a different spec under a used key is refused, and what happens when a submit worked and its answer was lost"
  status: "how queued, running, done, failed and cancelled are told apart, a job that died included"
  exit: "where the job's own exit code comes from"
  markers: "who writes `fetch.started`, and when; how the job's own markers come back"
  collect: "how the declared outputs and the run log come back, and nothing else"
  cancel: "how a job is stopped, and how the place knows it is gone"
  argv: "how the spec's argv, with its tokens, becomes the command that runs"
  manifest: "who hashes the files the inputs manifest names, and what holds a job back when one differs"
  resources: "which resources are honoured; any other is refused at submit"
  clean_interpreter: "whether the interpreter and libraries are ones the method builder could not have changed"
  blinds_the_method_builder: "whether running here keeps the withheld values from whoever built the method"

places:
  local:
    basis: "Built in adapter.py (LocalPlace). `adapter.py conformance` passes 34 of 34 and `adapter.py conformance --self-check` passes."
    status: built
    for: [known-answer tests on cheap cases, working data, rehearsals, "the system trial's tests (its opening runs by hand in the workspace)"]
    table:
      submit: "One supervisor process for each job, started by submit inside the job's environment; the job is its child, in a working directory of its own. The place's records are kept outside that directory."
      idempotency: "The job id is derived from the key. One record for each id under the place's root, made under a file lock: the same spec again is the same job and starts nothing; a different spec under the same key is refused. A submit that died before the job was released leaves no job and can be made again. Two roots are two places and know nothing of each other."
      status: "The supervisor's records, and a file lock the supervisor holds while it lives: a job whose supervisor is gone without a final record is failed, with the reason."
      exit: "The exit code the supervisor got from the job's first process. A signal, a time limit or a command that cannot be run is failed, never done."
      markers: "`fetch.started` is written by the supervisor after the manifest matched and just before the argv starts. Nothing is held back from a local job before that moment except its start, so here the marker means the argv started. The job's own `marker.<name>` files come back as job_markers."
      collect: "Outputs are hashed and copied, without following symlinks, into the place's own keep when the job ends; collect checks each hash again and copies them out under their relative paths, with run-log.json. Refused until the job is done, failed or cancelled."
      cancel: "A request the supervisor reads: SIGTERM to the job's session, 2 seconds, SIGKILL, then every process still in that session or carrying the job's tag. Cancelled is reported once they are gone."
      argv: "A token at the start of an argument is expanded at submit: {python} (the interpreter the place runs under), {work}, and any given with --token. The argv reaches the supervisor through a pipe from submit and is never read back from disk; both forms are in the run log."
      manifest: "The supervisor hashes each named file inside the job's environment, before `fetch.started`. When one differs the argv never starts and the job is failed."
      resources: "walltime_seconds is honoured, counted from the start of the argv. Any other resource is refused at submit."
      clean_interpreter: "No. It is the interpreter and the libraries on the method builder's machine. The job's environment is built from a short list and bytecode caches are not read, which closes the injected-path and planted-bytecode doors and no others."
      blinds_the_method_builder: "No. The job runs as the same user on the same machine as whoever built the method: the barrier is procedure and evidence."
    open_questions: []

  batch-scheduler:          # an HPC cluster: Slurm, PBS
    basis: "Written from how such schedulers are generally used, with Slurm and PBS as the models. Not read against any one site's documentation and not exercised: no adapter exists."
    status: specified
    for: [known-answer tests when a case costs a model run, working data that is large, openings on data that lives on the cluster]
    table:
      submit: "The adapter makes the job's record in a directory of the place's own on the shared file system, then hands the scheduler a job script of the place's own (not the method's) that does on the node what the supervisor does locally: checks the manifest, writes `fetch.started`, runs the argv, hashes the outputs."
      idempotency: "The contract's job id is the scheduler's job name, and the record is made under a lock before the scheduler is called, so a second submit finds the record: the same spec is the same job, a different spec is refused. When the scheduler was called and its answer was lost, the adapter asks the scheduler for a job of that name before it calls again."
      status: "The job script's own records first, the scheduler's accounting second: pending is queued, and a job the scheduler shows as ended without a final record from the script (time limit, out of memory, node failure, preempted) is failed, with the scheduler's word as the reason."
      exit: "The exit code the job script recorded for the argv. A kill by a signal or by the scheduler is failed, never done; the scheduler's accounting is the cross-check."
      markers: "`fetch.started` is written by the job script into the place's record directory before it starts the argv. The job's own `marker.<name>` files are read from its scratch directory when it ends."
      collect: "The job script hashes the declared outputs when the argv ends and copies them, without following symlinks, into the place's record directory; collect reads only from there. The run log adds node, partition and the scheduler's own job id."
      cancel: "The scheduler's cancel, by the scheduler's own job id (its SIGTERM, wait, SIGKILL). Cancelled is reported once the accounting shows the job ended."
      argv: "Tokens are expanded by the job script on the node: {python} is an interpreter the place names (a module, an environment or a container), {work} the job's scratch directory. The expanded argv goes in the run log."
      manifest: "The job script hashes the named files on the node, before `fetch.started`, and does not start the argv when one differs."
      resources: "walltime_seconds, cpus, memory_mb and a partition map to the scheduler's own limits. A resource with no such limit is refused at submit."
      clean_interpreter: "Only when the job runs from a fresh `git clone` of the locked commit, with its environment fixed by a lockfile or a container digest that the run log records, under an account the method builder does not use. Otherwise no."
      blinds_the_method_builder: "Only for data the job's account can read and the method builder's account cannot. For public data, no: running here changes which interpreter runs the locked code, not what the method builder can fetch."
    open_questions:
      - "whether asking the scheduler for a job by name can miss one it has accepted and not yet listed, so that a retry submits it twice"
      - "how long the scheduler's accounting remembers a finished job, and what status says after that if the job script left no final record"
      - "how `fetch.started` can come before the data where the job's account can already read the held-out files on the cluster's file system; there the marker means only that the argv started"
      - "where the place's record directory lives so that the job can write to it during the run and the method builder cannot at any time"
      - "which sites let a job run under an account the method builder does not use"

  cloud-batch:              # a managed batch service or a CI job with a container
    basis: "Written from how managed batch services and CI jobs are generally used. Not read against any one service's documentation and not exercised: no adapter exists."
    status: specified
    for: [openings, repeats at independent sites, scheduled re-tests]
    table:
      submit: "A job from a container image pinned by digest. The spec travels as the job's only input, and an entry point of the place's own in the image does what the supervisor does locally."
      idempotency: "A record named by the contract's job id is written to the place's own store with a write that fails if the record exists, before the service is called; the job is labelled with the id, and after a lost answer the adapter lists jobs by that label before it calls again."
      status: "The entry point's own records in the place's store first, the service's job state second: a job the service shows as ended without a final record from the entry point is failed, with the service's reason."
      exit: "The exit code the entry point recorded for the argv; the service's container exit code is the cross-check."
      markers: "`fetch.started` is written by the entry point to the place's store before it asks for the role or secret that can read the held-out data. This is the kind of place where the marker can mean what its name says."
      collect: "The entry point uploads the declared outputs and nothing else, hashed, to the job's prefix in the place's store; collect reads only that prefix. The run log adds image digest, region and the service's own job id."
      cancel: "The service's own cancel or terminate call. Cancelled is reported once the service shows the job stopped."
      argv: "Tokens are expanded by the entry point in the container: {python} is the image's interpreter, {work} the container's working directory. The code is a fresh `git clone` made by the entry point, and the manifest is what ties it to the lock."
      manifest: "The entry point hashes the named files in the container, before `fetch.started`, and does not start the argv when one differs."
      resources: "walltime_seconds, cpus and memory_mb map to the service's job limits. A resource with no such limit is refused at submit."
      clean_interpreter: "Yes when the image is pinned by digest and built from a lockfile, and the digest is in the run log. Not otherwise."
      blinds_the_method_builder: "Only where the held-out data sits behind a role that the opening's job alone is given. For public data, no: what keeps public data from the method builder is where the analysis assistant runs, which this file does not cover."
    open_questions:
      - "which services can refuse a second job with the same label by themselves, and whether listing by label can be trusted after a lost answer"
      - "for a CI job: whether a run can be found again by a label the adapter chose, and what makes a second run of the same key impossible and not merely unlikely"
      - "how the role that reads the held-out data is given to the opening's job and to no test job: by the key, by a protected environment, or by a person's approval"
      - "whether the code is baked into the image or cloned by the entry point; the argv cell assumes a clone, and which commit to clone is not in the job spec today"
      - "how long the place's store keeps a job's prefix, given that the contract has no verb to delete one"

  maap:                     # NASA's Multi-Mission Algorithm and Analysis Platform: a long-term extension
    basis: "As read in the platform's documentation (docs.maap-project.org, read 2026-11-25) and not exercised: no algorithm was registered and no job was submitted. The pages read were running algorithms at scale, job management with maap-py, and the application-package function guide. A cell that starts with 'As read' is that reading and nothing more; everything else about this platform is an open question."
    status: specified
    for: [methods that should run beside the mission data, sweeps across many sites]
    table:
      submit: "As read: a method is registered once as a platform algorithm from a repository, with its run command, container, queue and inputs; a job is then submitted with an algorithm id, a version, a queue and inputs, and the platform answers with a job id of its own. The contract's job id would travel as the submission's identifier."
      idempotency: "open question"
      status: "As read: the platform reports a job's status, asked by the platform's job id."
      exit: "open question"
      markers: "open question"
      collect: "As read: a job's products appear in the submitter's workspace; collect would copy the declared outputs from there."
      cancel: "open question"
      argv: "open question"
      manifest: "open question"
      resources: "As read: a queue is named at submit."
      clean_interpreter: "open question"
      blinds_the_method_builder: "open question"
    open_questions:
      - "idempotency: whether the platform refuses a second submission with the same identifier or runs it as a second job, and where the contract's job id and the spec's sha256 would be recorded"
      - "status: how the platform's states map onto queued, running, done, failed and cancelled, and what it reports for a job whose worker died"
      - "exit: whether the job's own exit code can be read back"
      - "markers: whether the place can write `fetch.started` before the job reaches data, and whether a failed job publishes anything at all, since a failed job is exactly when the marker matters"
      - "collect: whether everything a job writes to its output directory is published to the workspace (a place that collects everything fails conformance), and whether a held result can stay private there for the third-party window"
      - "cancel: whether a submitted job can be stopped, and how the place would know it is gone"
      - "argv: the run command is fixed when an algorithm is registered, so a spec's argv is not what runs; whether one entry point of the place's own can be registered to take the spec as its input and run the argv, or each locked method must be its own algorithm with its argv fixed at registration"
      - "argv: whether an algorithm version can be an exact locked commit, or only a branch or tag name that is built into an image when registered"
      - "argv: whether an algorithm can be registered from a private repository, which the third-party window needs"
      - "manifest: whether anything can hash the method's files inside the job before it starts"
      - "resources: whether a job can be given a time limit, and what the platform does at the limit"
      - "clean_interpreter: whether the job's metadata names the container image by digest, or only by name and location"
      - "blinds_the_method_builder: whether a job can read a secret that its submitter's workspace cannot; for data that every platform user can read from a workspace the answer is no, and that is most of what the platform is for"
      - "one opening: an algorithm that anyone with access can run again on the held-out window is a second opening outside every study log; the record of what has been opened does not span the platform"
      - "how the fetch of observation metadata alone is expressed as a platform algorithm"
      - "which registration path to use: the configuration file or the newer application package, if the second has replaced the first by then"

rules_for_every_place:
  - "A job is named by its idempotency key and its id is derived from the key, so the id is known before submit. The same key with the same spec is the same job and nothing runs twice; the same key with a different spec is refused."
  - "A place knows only its own jobs. The study log, not the place, is what limits openings to one: it is to record the opening, with the job id, before the job is submitted, and close it when the job is collected. That wiring is not built."
  - "The marker that decides whether an opening is used up is `fetch.started`, written by the place before the job can reach the data, never by the method after it. A job that has the marker has used the opening up, however it ended. A job without it never started, and a person may void it."
  - "The run log is evidence, not proof. It says what the place observed and names what it only carried as declared. The receipt still names its inputs by hash, and the study tool still checks the locked plan and code."
  - "Credentials live in the place's own secret store and are given to the job that is the opening and to no other: never in a repository, a prompt, or an environment an assistant works in. A job's environment is built from a short list plus the names its spec asks for, and those names are in the run log."
  - "What a job wrote stays at the place until a person removes it: the contract has no verb to delete a job. For the third-party window each place has to say how long that is before an opening is sent to it."
