# The procedure: how every study in this factory runs, as a file under review.
#
# What the study tool (sf.py) reads from this file, and therefore what changing it changes:
#   stages[].id, done_by, done_when, does     `sf.py status` works out where a study stands
#   measure.checks                            `sf.py scorecard` evaluates them on a study
# Everything else is written for the people and assistants who run the stages; the
# tool does not read it and does not enforce it.
# A `done_when` name the tool cannot check is refused, so a stage cannot claim to be
# finished by something nothing checks.
# The lock records this file's checksum. `sf.py status` and `sf.py scorecard` print the
# path and checksum of the procedure they read, and say so when it is not the file
# beside the tool or not the one the lock recorded.
# A change to this file is a pull request, and every adopted change gets a line
# in the change log with its prediction.
#
# Words: a study is one question taken from request to signed finding. The
# analysis plan is its analysis-plan.yaml. Held-out data is data nobody opens
# before the lock. A run receipt is the record a run writes, with its code and
# inputs by checksum and every number it produced. An assistant is always an AI
# agent; people are named as people.

factory: osp-science-factory
version: 0.7.0
product: a signed finding (the specification's finding concept), or a recorded negative result
by_products: [notes about the data and the method, drafted knowledge, method changes, a scorecard, a change-log entry]

# One factory per capability. In a software factory the unit is a product's
# repository or repositories. Here it is a capability: its knowledge, skills,
# computations, reference results and connectors, released together. The study
# tool and this file's template are shared; each capability carries its own copy
# of this file, its own studies, record of what has been opened, and change log,
# under its own stewards. This copy is the template, filled in for hydrology.
capability:
  name: "the hydrology capability"
  repositories: [hydrology]                    # a factory spanning several capabilities lists several
  borrows: [core, nasa-daac-knowledge]         # read by this factory, never written by it
  stewards: "the capability's code owners"
  holds: {studies: "factory/studies/", record_of_openings: "factory/studies/openings.jsonl", change_log: "factory/change-log.jsonl"}
  shared_across_factories: ["the study tool and this template (build-kit)", "the curating assistant's reading across factories", "where jobs run", "provider knowledge"]
  not_yet_shared: "the record of what has been opened is per factory; opening a window once across factories needs an organization-wide record"

study_kinds:
  confirmatory: "a planned claim and one opening of held-out data; the stages below"
  system_trial: "the same stages on a blind test case; checks the factory, never signed as a finding. The plan says `study_kind: system_trial`; the study closes only as system-trial-accepted (which needs the verdict in the study log to say the factory was right) or system-trial-declined"
  exploratory: "DESIGNED, NOT BUILT: sets data aside first, explores the rest, ends in a hypothesis that starts a confirmatory study"

request:       # what the scientist gives, in their own words (templates/request.md); `sf.py start --request` binds it by checksum
  fields: [what I want to know, the thing, why it matters, the difference that matters and where it comes from, what I have already looked at,
           what could be held out, what I will do with each answer, by when, how I expect it to be fooled, who is on it, what I want back,
           anyone else's product involved]
  questions_back: "four, asked by the analysis assistant, then stop (templates/kinds-of-question.yaml)"
  ways_to_hold_data_out: [a later period, sites never opened, a new release, a product never opened, forecasts scored later]

where_it_runs:   # for people: the study tool does not read this block. The tool runs every command on the machine it is
                 # called on; the places a job could run are in compute/places.yaml and the job contract is compute/adapter.py.
  default: local
  tests: local
  opening_held_out_data: "by hand, with sf.py open-held-out. Both planned openings are run that way: the system trial's in the workspace (its data is made at its own opening), and the first real study's from a fresh clone of the merged lock in a fresh container, which is somewhere the method was not built. A cloud or CI job, a cluster scheduler, or MAAP beside the data are places an opening could run later; none is wired to the tool"

people:
  scientist: asks in a request, in their own words; locks the plan with the steward (the difference that matters and the held-out data are theirs); receives the result first
  steward: locks the plan and the code with the scientist; signs knowledge; the only one who can sign a finding
  maintainer: reviews and merges method changes

assistants:        # AI agents. One may do several jobs unless a separation below forbids it.
  coordinating: {does: "follows sf.py status, relays questions, keeps the study moving", may_not: "lock or sign"}
  analysis:     {does: "asks the four questions, writes the analysis plan, builds the method and its known-answer tests, runs the tests, later writes the finding from run receipts only", never_sees: [held-out data before it is opened]}
  review:       {does: "reads the plan, the run receipts, the finding, the study log and the shared knowledge, and records approve or block", must: "have done none of this study"}
  curating:     {does: "reads notes and study logs across studies, sends each note where it belongs, drafts where a draft is owed", may_not: "merge or sign", runs: on a schedule}

separations:       # where information must not flow
  held_out_data:
    rule: "nobody reads held-out measurements before the opening; only the access gate fetches them"
    held_by: "sf.py open-held-out (refuses data that arrived early; the run receipt must name the fetched data by checksum); a clean machine for the opening when one is used"
    not_held_by_the_tool: "public data can be read elsewhere, and where the opening runs does not change that; until the analysis assistant works where it has no route to the withheld values, the barrier is instruction and evidence"
  independent_review:
    rule: "the review assistant did none of the study and shares no working context with the analysis assistant"
    held_by: "sf.py review (refuses anyone who started the study, ran a test, a rehearsal or an opening, attached the finding, locked or signed, by name without regard to case); a fresh context by practice"
  shared_knowledge:
    rule: "assistants write notes and may draft; the curating assistant reads across studies; a steward signs"
    held_by: "sf.py note, curation-list and resolve (a note is never deleted); signatures by the organization's signing tool"

stages:            # the five stages, with the two acts by people, the learning and the close as steps of their own: nine in all
  - id: ask
    done_by: coordinating assistant
    done_when: [started]
    does: "take the request; the analysis assistant asks the four questions; start the study with the request bound (sf.py start --request)"
  - id: plan
    done_by: analysis assistant
    done_when: [plan-complete]
    does: "search the shared knowledge for anything that already answers or limits the question; read only observation metadata; write the analysis plan"
    ends_early_when:      # recorded with sf.py close, citing what answered the question
      - "a signed finding already answers the question (answered-by-existing-knowledge)"
      - "a signed limit covers the claim (outside-a-signed-domain)"
      - "the method is a recorded dead end whose reopening condition is not met (dead-end)"
  - id: test
    done_by: analysis assistant
    done_when: [tests-pass, rehearsals-pass]
    does: "plan check, known-answer tests, working data and the rehearsals, repeated freely; every attempt the tool runs is logged"
  - id: lock
    done_by: people
    done_when: [locked]
    does: "the scientist and the steward lock the plan and the code together, reading what the lock prints (the bound files, the script each command runs, the environment variables each step is given by name, each rule and criterion with its measured rate, the request, this procedure); the lock cites the approved review and is committed before anything is opened"
  - id: open
    done_by: coordinating assistant
    done_when: [openings-complete]
    does: "sf.py open-held-out: the access gate fetches the held-out data and runs the locked analysis, once"
  - id: review
    done_by: analysis assistant, then review assistant
    done_when: [finding-attached, reviewed]
    does: "the analysis assistant writes the finding from run receipts only and attaches it; then the review assistant checks the result against the plan and every number in the finding against a run receipt, and records its verdict (a verdict recorded before the finding does not count)"
  - id: signature
    done_by: people
    done_when: [steward-decided]
    does: "the steward signs the finding, or records the decision not to; the signature event names the finding by path and checksum"
  - id: learn
    done_by: curating assistant
    done_when: [notes-resolved]
    does: "every note accepted, linked or declined; the scorecard filed; the change log updated with what was observed"
  - id: close
    done_by: coordinating assistant
    done_when: [closed]
    does: "sf.py close with the outcome; schedule the re-test the plan names"

rules_for_people:      # not checked by the tool here; each says what does hold it
  - "Tests are repeated freely. Held-out data is never reopened until it agrees (held by the openings allowed and the record of what has been opened)."
  - "An assistant never records the lock or the signature (the tool checks only the form of the name and that the evidence is an https link; what holds it is that the lock cites an approved review and is itself committed on a protected branch)."
  - "A finding quotes no number that is not in a run receipt (held by the findings checker)."
  - "Nothing about a named provider's product reaches a public place before the third-party findings policy is satisfied (held by where the opening runs and by review)."
  - "Inconclusive is a result and is final for that data; the next chance is the next data held out."

measure:
  # The process scorecard, worked out from a study's log. A check that cannot be
  # judged yet says `pending`.
  checks:
    - {id: chain-of-custody,   kind: log-checks-out,                why: "the study log, the run receipts, the record of what has been opened and the locked plan and code all check out, as far as the files in the workspace can show (a rewritten log shows only against a commit or a posted fingerprint)"}
    - {id: plan-adherence,     kind: not-exploratory,               why: "nothing was locked again after an opening, and the data had not been opened before"}
    - {id: opening-discipline, kind: openings-within-allowed,       why: "held-out data was opened no more often than planned"}
    - {id: no-failed-opening,  kind: no-failed-opening,             why: "no opening was used up on a run that crashed: the tests and rehearsals should have caught it"}
    - {id: lock-committed,     kind: lock-committed-before-opening, why: "the lock was in a commit before the held-out data was opened (the blind test harness, in its throwaway directories, is the one named exception)"}
    - {id: independent-review, kind: review-recorded,               why: "an assistant that did none of the study left a verdict after the finding was attached"}
    - {id: acts-by-people,     kind: acts-recorded-by-people,       why: "the lock and the signature were recorded under a person's name"}
    - {id: notes-curated,      kind: notes-on-curation-list,        why: "every note reached the curation list"}
  blind_test_of_the_system: "system_trial.py blind-test: blind test cases through the whole procedure; how often a false idea is supported, and a true one missed"
  improving_the_procedure:
    rule: "failed process checks and notes are grouped into proposals; every proposal is a pull request with its evidence linked; nothing is adopted automatically"
    change_log: "every adopted change is recorded with the problem it addresses, why, what it was predicted to do, what it did, and the setting it was tried in (sf.py log-change), so a later model or platform change can tell which changes to keep"
    later: "adopt a change only when what it gains outweighs what it breaks on a fixed set of studies and blind test cases that already pass"
