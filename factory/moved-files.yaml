# The table of moved files.
#
# On 2026-11-26 the files that sat together in one folder, `mvp/`, were moved
# into the layout the README shows. Some of what is kept in this repository
# is a record: a study log is chained by hash, and each test it logged names
# the code it ran by path and checksum. Those paths are the old ones. A log
# is never rewritten, so the old names are read through this table instead.
#
# Two programs read it.
#
#   tools/sf.py                reads `studies` and the `now` of each entry
#                              under `files`. A record listed under `studies`
#                              has its plan's roots read from where it stood,
#                              and an old path listed under `files` is looked
#                              for at its new place. The table only says where
#                              to look: what is found is hashed and compared
#                              with what the log recorded, so a moved file that
#                              also changed still shows as changed. The tool
#                              does not read the `sha256` lines.
#   tools/check_old_records.py checks every line here against the files on
#                              disk, then rebuilds the old layout in a scratch
#                              folder and asks the study tool as it stood then
#                              (kept byte for byte, see `kept_as`) what it says
#                              about each record, and compares that with what
#                              it said before the move.
#
# Two files changed with the move, because they find other files by path:
# the study tool, and the system trial's script. A test in a kept log passed
# under the earlier bytes of both. So the study tool of today says of those
# records what it says after any change to itself: the tests passed on other
# code, run them again. That is the check doing its work, and no table can or
# should answer it. The earlier bytes are kept so the records can still be
# checked by the tool that made them.

moved_on: "2026-11-26"

# where a record stands now: where it stood when its log was written
studies:
  studies/exhibits/practice-run-STUDY-0001: mvp/exhibits/practice-run-STUDY-0001
  studies/exhibits/system-trial-ready-STUDY-0000: mvp/exhibits/system-trial-ready-STUDY-0000

# where a file stood: where it stands now, and its checksum on the day of the move
files:
  mvp/gain.py:
    now: methods/gain/gain.py
    sha256: fa7e07f34d190bf7128105a12368059d7fdb29a36005f5654d7600e635aa276a
  mvp/confront.py:
    now: methods/gain/confront.py
    sha256: c2a057d2b7af66dc1df4e0527346579c026ed3b31a239b4c5c6c9c22565e6336
  mvp/known_answer_tests.py:
    now: methods/gain/known_answer_tests.py
    sha256: 8e8205a2b64e6734b8a74c5039b03b7e8ef608e2e4cdc5a85b3e14feb7cbaf63
  mvp/test_cases.py:
    now: methods/gain/test_cases.py
    sha256: c280c741370982dc72183c6089ff218115c26c9663a2ebe0d5ebbc967a923899
  mvp/procedure.yaml:
    now: factory/procedure.yaml
    sha256: 81778121373cb8a5194e19b33fe6559ed8b00f1266258fb3f5a087ebc959f86d
  mvp/change-log.jsonl:
    now: factory/change-log.jsonl
    sha256: a1afa06d1872f2f1d0e6a5628ef076be27bf3e3f1f4e39aee770bc51ca566c65
  mvp/system_trial.py:
    now: methods/gain/system_trial.py
    sha256: 7a6e32836d3f3d5637551cd44c53ed33f7e7417f2a2ac03e049d64ccc8f58126
    kept_as: studies/exhibits/as-recorded/system_trial.py
    changed: "it loads the study tool by path, and the study tool is no longer in the same folder"
  mvp/sf.py:
    now: tools/sf.py
    sha256: 2d61ec4c85a1f2d0d5cc80a1bcaaef6965ed1f79a266eac8446e2934b5a5cc62
    kept_as: studies/exhibits/as-recorded/sf.py
    changed: "it finds the procedure, the templates and the method by path, and it gained this table"

# folders the old layout is rebuilt from, for tools/check_old_records.py only:
# where a folder stood, and where its contents stand now
folders:
  mvp/exhibits: studies/exhibits
  examples/baton-rouge/studies: examples/baton-rouge/studies

# the records, and what the study tool said of each before the move
# (the files are in studies/exhibits/as-recorded/before-the-move/).
# `plan_names_the_checkouts`: the plan runs a script of the hydrology checkout
# for its fetch, and the log check reads the plan, so without the checkouts
# beside this repository even the log check cannot be replayed.
records:
  - stood_at: mvp/exhibits/system-trial-ready-STUDY-0000
    status: system-trial-ready-STUDY-0000.status.json
    check_log: system-trial-ready-STUDY-0000.check-log.json
  - stood_at: mvp/exhibits/practice-run-STUDY-0001
    plan_names_the_checkouts: true
    status: practice-run-STUDY-0001.status.json
    check_log: practice-run-STUDY-0001.check-log.json
    check_log_with_change_log: practice-run-STUDY-0001.check-log-with-change-log.json
  - stood_at: examples/baton-rouge/studies/STUDY-0002
    plan_names_the_checkouts: true
    status: baton-rouge-STUDY-0002.status.json
    check_log: baton-rouge-STUDY-0002.check-log.json
