# The two acts by people, as a GitHub workflow. A template: copy it to .github/workflows/acts.yml in the repository
# where the studies live, with tools/ and factory/ of the science factory in that repository. README.md beside this
# file is the checklist that goes with it. This workflow has never run on GitHub; the two scripts it calls are
# tested as ordinary programs (their own --selftest).
#
# request-check: on a pull request that touches a study's lock-request/ or signature-request/, checks that the
#   manifest matches the files, that the pull request targets the protected branch, that enough people other than
#   its author have approved, and that nothing an approval covered changed afterwards; and shows the evidence
#   summary on the pull request. Make it a required status check on the protected branch.
# record: after the merge, writes the lock or the signature into the study log, citing the merge commit; then asks
#   the platform itself who approved (`sf.py verify-acts`) and records its answer; then commits the log under the
#   repository's name. Until the platform has answered, the act stands as `merge found, people not verified`.
# so-what: on a new comment on an issue that begins with `so-what:`, records a person's so what on a reviewed lead
#   into the exploration's log under the platform's name, then asks the platform about the comment
#   (`explore.py verify-so-what`) and records its answer, then commits the log. It is lighter than the two acts: no
#   pull request and no merge, because it opens no data and binds no plan (docs/WHAT-IS-ENFORCED.md says why).
name: acts by people

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches: [main]            # the protected branch that factory.yaml names
  issue_comment:
    types: [created]            # a person's so what on a lead; an edited comment is not taken, and the verification sees an edit

permissions:
  contents: read

jobs:
  request-check:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The scripts, the tools and the definition come from the protected branch, never from the pull request, so a
      # pull request cannot bring its own check with it. The study comes from the pull request.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: The reviews, as the platform records them
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" > "$RUNNER_TEMP/reviews.json"
      - name: Check the request
        run: >
          uv run base/factory/harnesses/github/verify_request.py
          --repo head --tools base/tools --factory base/factory
          --event "$GITHUB_EVENT_PATH" --reviews "$RUNNER_TEMP/reviews.json"
          --summary-out "$RUNNER_TEMP/summary.md"
          --image-base "https://github.com/${{ github.repository }}/raw/${{ github.event.pull_request.head.sha }}"
      - name: Show the evidence summary on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s "$RUNNER_TEMP/summary.md" || exit 0
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --edit-last --body-file "$RUNNER_TEMP/summary.md" \
            || gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/summary.md"

  record:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # this job commits the study log; the checklist says how the branch lets it
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: The pull request this commit merged, and its reviews, as the platform records them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" > "$RUNNER_TEMP/pulls.json"
          number=$(uv run factory/harnesses/github/record_act.py --which-pull "$RUNNER_TEMP/pulls.json" --commit "${{ github.sha }}")
          test -n "$number" || { echo "no merged pull request for this commit: nothing to record"; exit 0; }
          gh api "repos/${{ github.repository }}/pulls/$number" > "$RUNNER_TEMP/pull.json"
          gh api --paginate --slurp "repos/${{ github.repository }}/pulls/$number/reviews" > "$RUNNER_TEMP/reviews.json"
      - name: Record the act in the study log, then ask the platform who approved and record its answer
        env:
          GH_TOKEN: ${{ github.token }}   # read by `sf.py verify-acts`; this job's token reads contents and pull requests of this repository
        run: |
          test -s "$RUNNER_TEMP/pull.json" || exit 0
          uv run factory/harnesses/github/record_act.py --repo . --pull "$RUNNER_TEMP/pull.json" --reviews "$RUNNER_TEMP/reviews.json" --commit "${{ github.sha }}" --verify
      - name: Commit the study log under the repository's name
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*study-log.jsonl'
          git diff --cached --quiet && exit 0
          git commit -m "Record the act merged in ${{ github.sha }}"
          git push

  so-what:
    if: github.event_name == 'issue_comment' && !github.event.issue.pull_request && startsWith(github.event.comment.body, 'so-what:')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # this job commits the exploration log; the checklist says how the branch lets it
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: The comment, as the platform records it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}" > "$RUNNER_TEMP/comment.json"
      - name: Record the so what in the exploration's log, then ask the platform about the comment and record its answer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          where=$(python3 -I -c 'import json, re, sys
          body = json.load(open(sys.argv[1]))["body"]
          m = re.search(r"^exploration:[ \t]*(explorations/[A-Za-z0-9][A-Za-z0-9_.-]*)[ \t]*$", body, re.M)
          print(m.group(1) if m and ".." not in m.group(1) else "")' "$RUNNER_TEMP/comment.json")
          test -n "$where" || { echo "the comment names no exploration as explorations/<name>: nothing to record"; exit 0; }
          uv run tools/explore.py so-what --exploration "$where" --by platform:github --record-comment "$RUNNER_TEMP/comment.json"
          uv run tools/explore.py verify-so-what --exploration "$where" --by platform:github
      - name: Commit the exploration log under the repository's name
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*exploration-log.jsonl'
          git diff --cached --quiet && exit 0
          git commit -m "Record the so what in comment ${{ github.event.comment.id }}"
          git push
