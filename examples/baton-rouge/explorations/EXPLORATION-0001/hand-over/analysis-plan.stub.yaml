# Exploring: a stub from EXPLORATION-0001, not an analysis plan. The study tool will not read this file.
# The analysis assistant writes analysis-plan.yaml from mvp/templates/analysis-plan.yaml at the plan stage and takes
# from here the question, the quantity, the data and the choices to fix. The held-out data may only be what the
# exploration set aside; `explore.py check-study` refuses anything else.
study: STUDY-0002
question: Over the first full year of forward processing (2025-04-28 to 2026-04-27), does SWOT reach water surface
  elevation at Baton Rouge rise and fall by the same amount as the gauge, to within five percent?
quantity_estimated: 'The gain: the coefficient on gauge elevation when satellite elevation is regressed on gauge
  elevation and time across paired passes (15 minutes, Version D named, passes with reach_q at or above 2 left out
  before pairing), with a 95 percent sampling interval under a lag-1 model of the residuals.'
data:
  working: 'Calendar 2024, the committed fixture swot_gauge_baton_rouge_2024.json in the hydrology capability (52
    Version D passes, the gauge readings around each, and 47 Version C passes kept for the version step) Explored
    in EXPLORATION-0001: already seen, never held out.'
  held_out:
    pair:
      collection: SWOT_L2_HR_RiverSP_reach_D
      gauge: USGS-07374000
      reach_id: '74210000331'
    why_this_window: The hydrology bundle's signed SWOT lake dataset concept records that the Version D family changes
      from reprocessing (PGD0, through 2025-04-27) to forward processing (PID0) on 2025-04-28, and its signed river
      concept records the same two processing identifiers. Everything from that date on is one processing baseline,
      the request says none of it has been looked at, and it keeps growing, so it is what a later test would want.
      2025-01-01 to 2025-04-27 is neither explored nor set aside.
    window:
      start: '2025-04-28'
      end: 'CHOOSE: a date inside the set-aside window'
from_the_lead:
  difference_that_matters: Five percent, from the request, where the scientist calls it their own judgment and not
    a requirement. It is the scientist's to confirm before any lock.
  rule_sketch: Supported if the whole interval lies inside 0.95 to 1.05; refuted if it lies wholly outside; anything
    else is inconclusive and final for that window.
  hard_cases: A flagged pass at the lowest stage that is metres off; an unflagged pass with high dark fraction that
    is a metre off; errors correlated in time; a gain that bends with stage; a window that mixes processing identifiers.
  what_this_could_not_show: 'Which instrument is right, anything about other reaches, or whether the relation bends
    with stage. And it changes two things at once: the year and the processing baseline (2024 was explored on reprocessed
    data, the set-aside window is forward processing), so a result that differs from 2024 could not say which of
    the two changed. One year at one pair, on provisional gauge values.'
choices_to_fix_in_the_plan:
- 'CHOICE-003: Keeping every pass gives a gain of 1.0255 (plain interval 0.9941 to 1.0570, LOOK-011) against 1.0121
  with the screen (LOOK-012), and change scores of +0.9567 and 0.3823 m against +0.9896 and 0.1859 m. All of that
  difference is one pass, 2024-10-30, which moves the gain by 0.0109 on its own; the other two flagged passes are
  ordinary (LOOK-025). So the 2024 evidence that the flag marks bad passes is one pass in three. The screen is proposed
  anyway because the signed dataset page calls the flag a gate, and because screening on wse_u or dark_frac does
  not mark that pass (0.095 m and 0.020).'
- 'CHOICE-004: One gain hides any bend with stage. By half of stage the package''s method gives 1.0131 (0.968 to
  1.0583, 23 pairs) for the lower half and 0.9833 (0.9125 to 1.054, 24 pairs) for the upper (LOOK-020): both intervals
  include one and each other, so 2024 cannot tell a bend from none. The model also carries a time term, which comes
  out at -0.124 m per year; one year cannot tell a drift from the seasonal cycle, so that number means nothing yet.'
- 'CHOICE-005: Leaving out the one high dark fraction pass as well gives a gain of 1.0101 with a plain interval
  of 1.0003 to 1.0198 and a residual spread of 0.082 m in place of 0.155 m (LOOK-018). The gain barely moves; the
  interval narrows a good deal, and it narrows because of a threshold drawn around one pass after seeing it.'
- 'CHOICE-006: Not tried another way. Halves, quartiles or fixed bands were not run, so the statements by third
  of stage (the 0.09 m offset at low stage, the 0.081 m spread there) are for these bins only.'
pitfalls_to_make_hard_cases:
- 'The level difference is not a bias: the two records are on different vertical references (signed: hydrology/knowledge/recipes/swot-gauge-confrontation.md;
  the unsigned draft gotchas/swot-gauge-datum-mismatch.md says the same of lakes). Everything here is read on changes,
  departures and the gain.'
- 'The product versions differ by metres at this reach and cannot be joined on time (signed: gotchas/hydrocron-collection-default.md).
  Only Version D was used; the Version C rows in the fixture were not.'
- 'The quality flag is a gate, not a size of error (signed: datasets/swot-river-lake.md). Not applying it lets one
  pass carry 0.71 of the summed squared departure (LOOK-004). Raised as NOTE-001; the recipe''s worked example does
  not apply it (NOTE-003).'
- 'The quality flag missed one bad pass that dark_frac and wse_u both mark (NOTE-002). One pass: a warning, not
  a threshold.'
- 'The gauge values are provisional throughout 2024, and provisional values can be revised or withdrawn (signed:
  gotchas/nwis-provisional-data.md, read after the review). A later window would be provisional too.'
- 'Spreads: the first looks printed population standard deviations (pairs.py); the later ones print sample values
  (pairs_v2.py). For 47 or 50 pairs they differ by one percent. For the three flagged pairs the spread is 0.798
  m one way and 0.978 m the other (LOOK-005, LOOK-028), and with three points neither means much.'
- Plain least squares intervals from my own look script are too narrow, because passes are correlated in time. The
  only interval to lean on is the one from the package's gain method (LOOK-020).
- 2024 is taken to be one processing baseline (reprocessed) on the word of the signed knowledge. The fixture carries
  no processing identifier for any pass, so no look could check it.
