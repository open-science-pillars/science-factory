what_looks_true: >
  At the Mississippi reach at Baton Rouge (reach 74210000331 against gauge USGS-07374000, Version D, calendar 2024,
  50 of 52 passes paired within 15 minutes), SWOT reach height looks as if it follows the gauge closely over the
  whole 1.47 to 10.33 m range of stage. With the three passes flagged reach_q 2 left out, the gain is 1.0121 with a
  95 percent sampling interval of 0.9862 to 1.0381 (47 pairs), and changes between passes correlate at +0.9896
  with an RMSD of 0.1859 m. A gain just above one shows in the departures too: the lowest third of stage sits
  about 0.09 m lower against the gauge than the other two thirds (medians -0.091, +0.027 and +0.023 m), which is
  the gain seen another way and not a second effect. Where it does not follow, in 2024, is two passes, named
  here and not a pattern: 2024-10-30, flagged reach_q 2, at the lowest stage of the year, 1.776 m low; and
  2024-03-26, not flagged, 0.939 m high, with the year's highest dark fraction (0.692) and largest stated
  uncertainty (0.296 m). The other two flagged passes are 0.080 and 0.084 m from the rest, which is ordinary.
  With the three flagged passes and the 03-26 pass out, the residual spread about the gain line is 0.082 m, below
  the product's median stated uncertainty of 0.096 m. Low water by itself does not look like where it fails: the
  15 unflagged pairs in the lowest third of stage have a sample spread of 0.081 m.
how_it_was_found: >
  Read the signed recipe first, which already gives the 2024 change scores for this pair and rules out scoring the
  level. Ran the recipe's own executor and reproduced its correlation (+0.9567), RMSD (0.3823 m) and, once my
  script used the sample spread as the recipe does, its gauge change spread (1.1959 m). Then looked at each pair's
  departure from the median level difference: by size, by quality flag, by third of stage, by third of dark
  fraction, by rising and falling limb, and against the product's stated uncertainty. That is six ways of cutting
  the same 50 pairs, so one pass standing out in a cut is not by itself remarkable. One pair carried 0.71 of the
  summed squared departure, and it was flagged. Tried the flag screen, then a gain by least squares with and
  without it, then the package's own gain method for an interval that allows for correlation in time. Tried
  pairing at 5 and at 60 minutes. Two looks failed on my own mistakes (a missing folder, a guessed key) and are in
  the count. A review then found nine holes; five more looks and two more readings answered them, and what could
  not be closed is written here as a limit.
evidence: [LOOK-003, LOOK-004, LOOK-005, LOOK-009, LOOK-011, LOOK-012, LOOK-014, LOOK-015, LOOK-016, LOOK-017, LOOK-018, LOOK-020, LOOK-023, LOOK-025, LOOK-026, LOOK-027, LOOK-028, LOOK-029]
choices_that_would_change_it:
  - choice: CHOICE-003
    how: "Keeping every pass gives a gain of 1.0255 (plain interval 0.9941 to 1.0570, LOOK-011) against 1.0121 with the screen (LOOK-012), and change scores of +0.9567 and 0.3823 m against +0.9896 and 0.1859 m. All of that difference is one pass, 2024-10-30, which moves the gain by 0.0109 on its own; the other two flagged passes are ordinary (LOOK-025). So the 2024 evidence that the flag marks bad passes is one pass in three. The screen is proposed anyway because the signed dataset page calls the flag a gate, and because screening on wse_u or dark_frac does not mark that pass (0.095 m and 0.020)."
  - choice: CHOICE-004
    how: "One gain hides any bend with stage. By half of stage the package's method gives 1.0131 (0.968 to 1.0583, 23 pairs) for the lower half and 0.9833 (0.9125 to 1.054, 24 pairs) for the upper (LOOK-020): both intervals include one and each other, so 2024 cannot tell a bend from none. The model also carries a time term, which comes out at -0.124 m per year; one year cannot tell a drift from the seasonal cycle, so that number means nothing yet."
  - choice: CHOICE-005
    how: "Leaving out the one high dark fraction pass as well gives a gain of 1.0101 with a plain interval of 1.0003 to 1.0198 and a residual spread of 0.082 m in place of 0.155 m (LOOK-018). The gain barely moves; the interval narrows a good deal, and it narrows because of a threshold drawn around one pass after seeing it."
  - choice: CHOICE-006
    how: "Not tried another way. Halves, quartiles or fixed bands were not run, so the statements by third of stage (the 0.09 m offset at low stage, the 0.081 m spread there) are for these bins only."
choices_that_would_not:
  - choice: CHOICE-001
    why: "At 60 minutes all 52 passes pair, the spread of the level difference is 0.293 m against 0.298 m at 15 minutes (both population values, LOOK-015 and LOOK-003), and the screened gain is 1.0115 against 1.0121 (LOOK-017, LOOK-012). At 5 minutes 21 passes are lost for no gain in agreement (LOOK-016)."
  - choice: CHOICE-002
    why: "Mean or median only shifts every departure by the same constant, so no spread, gain or change score depends on it. The alternative of scoring the level as a bias is ruled out by the signed recipe and was not run."
pitfalls:
  - "The level difference is not a bias: the two records are on different vertical references (signed: hydrology/knowledge/recipes/swot-gauge-confrontation.md; the unsigned draft gotchas/swot-gauge-datum-mismatch.md says the same of lakes). Everything here is read on changes, departures and the gain."
  - "The product versions differ by metres at this reach and cannot be joined on time (signed: gotchas/hydrocron-collection-default.md). Only Version D was used; the Version C rows in the fixture were not."
  - "The quality flag is a gate, not a size of error (signed: datasets/swot-river-lake.md). Not applying it lets one pass carry 0.71 of the summed squared departure (LOOK-004). Raised as NOTE-001; the recipe's worked example does not apply it (NOTE-003)."
  - "The quality flag missed one bad pass that dark_frac and wse_u both mark (NOTE-002). One pass: a warning, not a threshold."
  - "The gauge values are provisional throughout 2024, and provisional values can be revised or withdrawn (signed: gotchas/nwis-provisional-data.md, read after the review). A later window would be provisional too."
  - "Spreads: the first looks printed population standard deviations (pairs.py); the later ones print sample values (pairs_v2.py). For 47 or 50 pairs they differ by one percent. For the three flagged pairs the spread is 0.798 m one way and 0.978 m the other (LOOK-005, LOOK-028), and with three points neither means much."
  - "Plain least squares intervals from my own look script are too narrow, because passes are correlated in time. The only interval to lean on is the one from the package's gain method (LOOK-020)."
  - "2024 is taken to be one processing baseline (reprocessed) on the word of the signed knowledge. The fixture carries no processing identifier for any pass, so no look could check it."
proposed_plan:
  question: "Over the first full year of forward processing (2025-04-28 to 2026-04-27), does SWOT reach water surface elevation at Baton Rouge rise and fall by the same amount as the gauge, to within five percent?"
  quantity_estimated: "The gain: the coefficient on gauge elevation when satellite elevation is regressed on gauge elevation and time across paired passes (15 minutes, Version D named, passes with reach_q at or above 2 left out before pairing), with a 95 percent sampling interval under a lag-1 model of the residuals."
  difference_that_matters: "Five percent, from the request, where the scientist calls it their own judgment and not a requirement. It is the scientist's to confirm before any lock."
  rule_sketch: "Supported if the whole interval lies inside 0.95 to 1.05; refuted if it lies wholly outside; anything else is inconclusive and final for that window."
  hard_cases: "A flagged pass at the lowest stage that is metres off; an unflagged pass with high dark fraction that is a metre off; errors correlated in time; a gain that bends with stage; a window that mixes processing identifiers."
  what_this_could_not_show: "Which instrument is right, anything about other reaches, or whether the relation bends with stage. And it changes two things at once: the year and the processing baseline (2024 was explored on reprocessed data, the set-aside window is forward processing), so a result that differs from 2024 could not say which of the two changed. One year at one pair, on provisional gauge values."
