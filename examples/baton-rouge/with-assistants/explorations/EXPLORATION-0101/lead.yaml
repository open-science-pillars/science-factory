what_looks_true: >
  Version 2, written after REVIEW-001; it claims less than version 1. Everything is calendar 2024 at Baton Rouge
  (reach 74210000331, collection SWOT_L2_HR_RiverSP_reach_D, against USGS-07374000, provisional stage), 52 passes, 50 of
  them paired within 15 minutes.
  WHAT LOOKS TRUE. (1) Most passes follow the gauge closely and a few are grossly wrong. Against a line that needs no
  screen, 2 of 52 passes (0.038) depart by more than 0.5 m and no other pass departs by more than 0.217 m: 2024-10-30,
  1.699 m low, at the lowest stage at any pass, and 2024-03-26, 0.907 m high, at high water. (2) The quality flag does
  not mark them. reach_q is 1 on 49 passes and 2 on 3, and no pass has 0, so every pass of the year carries a non-zero
  flag and "reach_q below 2" only means "reach_q equal to 1". One of the 3 passes with reach_q 2 departs and one of the
  2 departing passes has reach_q 2. The stated uncertainty does not mark them either: the pass 1.699 m off states 0.095 m, and its departure is 17.9 times that. (3) The size of rise and fall looks within five per cent of the gauge's
  under every way of leaving passes out, but only as a point estimate when nothing is left out: the gain is 1.0345
  [1.0034, 1.0656] on all 50 pairs (the interval is not inside 0.95 to 1.05), 1.0190 [0.9968, 1.0412] with reach_q
  equal to 1 (47 pairs), and 1.0140 [1.0043, 1.0236] when the pass with wse_u above 0.2 m is also left out (46 pairs,
  change RMSD 0.1051 m, correlation +0.9962). That last limit is the analyst's, set after seeing the one pass it
  removes; it is not a marking by the product.
  WHAT DOES NOT HOLD. (a) Version 1 said passes "the product itself marks" were left out: the flag part removes three
  passes to catch one, and the other part is a threshold tuned on one pass. (b) Version 1 said the gain looks slightly
  above one. On the same 46 pairs, the same pairing and the same kind of interval, the gain is 1.0101 [0.9987, 1.0214]
  with a time term, 1.0048 [0.9846, 1.0249] with the product's reach slope, 0.9983 [0.9771, 1.0194] with both, 1.0133
  [0.9675, 1.0591] in the lower half of stage and 0.9871 [0.9640, 1.0101] in the upper half: every one of these
  includes one. (c) Version 1 set the residual scatter beside the median stated uncertainty as if they agreed. On the
  screened pairs wse_u hardly varies (0.0930 to 0.1101 m), so that comparison only says the stated uncertainty is not
  exceeded once the two worst passes are gone; it does not say the stated uncertainty tells a good pass from a bad one.
  (d) "Probably well at high water" is only partly borne out: on the screened pairs the scatter is 0.0619 m in the
  highest third of stage against 0.0807 m in the lowest, but the one unflagged gross error is at high water. (e) Read
  as the recipe's change RMSD over the gauge change spread, five per cent is not met under any screen tried: 0.3197
  with all passes, 0.0867 at best.
  OPEN EXPLANATIONS, NOT THINGS SEEN. Why the screened pairs sit about 1.4 per cent steep is not known, and this year
  cannot say. With the gain held at exactly one, a step of -0.0940 m (plain standard error 0.0254) for the lowest third
  of stage leaves a residual scatter of 0.0808 m, the reach slope times a distance of 4042 m leaves 0.0813 m, a drift
  of -0.1322 m per year leaves 0.0844 m, and a free gain leaves 0.0824 m; a constant offset alone leaves 0.0915 m. So
  a gain, a low-water offset, a drift and the gauge's place in the reach fit about equally, because in 2024 stage,
  time and reach slope move together (correlation of gauge with reach slope +0.876, with time -0.574). The gauge's
  place is the one that could be settled without new satellite data: the reach slope rises by 3.179 ppm per metre of
  stage, so each kilometre between the gauge and the point the reach height refers to adds 0.0032 to the gain; the
  0.44 km the signed recipe states would give 0.0014, and 4.39 km would give all of it, and the knowledge does not say
  what the 0.44 km is measured to. Also open: whether the satellite reads lower on rising water than on falling
  (difference -0.0539 m, plain standard error 0.0244, 17 rising against 25 falling passes), which a river with a
  steeper surface on the rise would give; what went wrong on 2024-10-30 (clear surface, ordinary stated uncertainty,
  the only reach slope below -2.801 ppm); and whether 2024-03-26 (dark_frac 0.6922, reach slope 135.8 ppm against at
  most 42.0 ppm elsewhere) is a height carried along a wrong slope from a partly observed reach. Both are read as
  satellite departures and not gauge faults, which is itself a reading (CHOICE-006).
  The level difference is not scored: the two are on different vertical references.
how_it_was_found: >
  Data after calendar 2024 was set aside first, before the knowledge or the data was read. Thirteen knowledge pages were
  read (twelve listed by the tool and one more), all signed except one draft. First session: the signed recipe's shipped
  executor was run unmodified and its 2024 scores reproduced (LOOK-002, LOOK-003); every pass was listed by name
  (LOOK-004); the gain was computed under eight ways of leaving passes out and by Theil-Sen (LOOK-005), leaving each
  pass out in turn on two sets (LOOK-006), by stage third and half, by rising and falling water and against time, on
  three sets (LOOK-007), with a reach-slope term on two sets (LOOK-008), under five pairing rules on two sets
  (LOOK-009), against the stated uncertainty and the flag (LOOK-010), by three overpass tracks and with a time term on
  three sets (LOOK-011), and the two departing passes were set beside their neighbours (LOOK-012). Tried and dropped: a
  split by the minute of the pass time into 22 groups (part of LOOK-010), a bad key. All six choices of that session
  were written into the log after the last of those looks, although the screen and the two dates were already in the
  script of LOOK-005; so the screen, flag part and wse_u part alike, was chosen after seeing which passes depart.
  Second session, answering REVIEW-001: two choices were recorded first (one footing for every gain; what counts as a
  gross error and which product fields a rule may use), then five looks. LOOK-013 counted the flag values and the
  fields the file carries. LOOK-014 refitted the gain on one pairing with one kind of interval, for four ways of
  leaving passes out, each with four models and two halves of stage (24 fits), plus leave-one-out on the 46 screened
  pairs (gains from 1.0127 to 1.0155) and rising against falling water. LOOK-015 held the gain at one and tried a
  drift, a low-stage step and a slope term in its place on two sets, and worked out the gain that geometry would give.
  LOOK-016 tried every possible cut on five product fields in both directions and six two-part rules. LOOK-017 printed
  the change RMSD over the gauge change spread for the eight screens of LOOK-005. Two further choices were recorded
  after those looks (what the headline says; what the proposed test asks). The count of 17 looks understates what was
  tried: inside them are the fits, cuts, screens, groups and rules listed here, well over a hundred comparisons, all on
  one year of 52 passes. The residual scatter quoted from LOOK-014 and LOOK-015 divides by the count less the number of
  fitted terms, so it reads slightly larger than the same scatter in LOOK-005 (0.0824 m against 0.0815 m). The Version
  C block that the working file also carries was not used.
evidence: [LOOK-001, LOOK-003, LOOK-004, LOOK-005, LOOK-006, LOOK-007, LOOK-008, LOOK-009, LOOK-010, LOOK-011, LOOK-012, LOOK-013, LOOK-014, LOOK-015, LOOK-016, LOOK-017]
choices_that_would_change_it:
  - choice: CHOICE-003
    how: >
      The five per cent was read as a gain, a reading chosen knowing the recipe's own score would not meet it, and the
      quantity itself was already named in the docstring of mvp/gain.py before any look (see the leak under pitfalls).
      Read as the recipe's change RMSD over the gauge change spread it is 0.3197 with all passes, 0.1501 with reach_q
      equal to 1, and 0.0867 at best under the eight screens tried (LOOK-017): never below 0.05. The other readings
      (correlation of the changes, ratio of standard deviations) were not tried as rules.
  - choice: CHOICE-004
    how: >
      This is the choice that moves the numbers most. It was made after seeing which passes depart, both parts of it,
      and the flag part was already stated in the docstring of mvp/confront.py before any look. No screen: gain 1.0345
      [1.0034, 1.0656], not inside 0.95 to 1.05, change RMSD 0.3823 m. reach_q equal to 1: 1.0190 [0.9968, 1.0412],
      change RMSD 0.1859 m. With wse_u below 0.2 m as well: 1.0140 [1.0043, 1.0236], change RMSD 0.1051 m. Leaving the
      two passes out by date: 1.0146 [1.0053, 1.0238]. Theil-Sen with no screen: 1.0193 on 50 pairs (LOOK-005) and
      1.0186 on all 52 passes (LOOK-016), no interval computed. The 0.2 m limit is one of many that do the same thing:
      any cut on wse_u between 0.1101 m and 0.2962 m, or on dark_frac between 0.2510 and 0.6922, or on reach slope
      between 42.0 and 135.8 ppm removes that one pass and nothing else (LOOK-013, LOOK-016), so the year fixes no
      threshold. This screen is not carried into the proposed test.
  - choice: CHOICE-005
    how: >
      Replaced for the headline by CHOICE-009. It does not move whether the point estimate is within five per cent; it
      decides whether the gain can be told from one. On the 46 screened pairs, on one footing (LOOK-014): gauge alone
      1.0140 [1.0043, 1.0236]; with a time term 1.0101 [0.9987, 1.0214], drift -0.0713 m per year (plain standard error
      0.0524); with the reach slope 1.0048 [0.9846, 1.0249]; with both 0.9983 [0.9771, 1.0194]; lower half of stage
      1.0133 [0.9675, 1.0591]; upper half 0.9871 [0.9640, 1.0101]. With the two passes left out by date instead (48
      pairs) the time-term interval is [1.0014, 1.0221] and excludes one, so even that depends on the screen.
  - choice: CHOICE-006
    how: >
      Not tried as an alternative analysis. If either departing pass were a gauge fault or a real difference between a
      reach average and a point, leaving it out would hide a failure of the comparison, not of the product. What
      supports the reading: the gauge moves by at most 0.024 m between readings around each pass and the neighbouring
      passes are ordinary (LOOK-012). What was left unsaid in version 1: with the 2024-03-26 pass kept in, the
      slope-term fit gives a gain of 0.9894 and a distance of 7820 m (plain standard error 761 m), a fit carried by
      that one pass, which hints that its error goes with its reported slope. The gauge is provisional throughout 2024.
  - choice: CHOICE-008
    how: >
      The definition of a gross error was drawn in a gap already seen in LOOK-004. At 0.3 m in place of 0.5 m the same
      2 of 52 passes qualify (LOOK-016); a limit below 0.217 m would start to add ordinary passes, and that was not
      tried. Rules that compare a pass with its neighbours in time were not tried. Under this definition the flag
      alone catches 1 of 2 and removes 2 ordinary passes; the flag with any of the single-pass cuts catches both and
      removes 2 ordinary passes; reach slope below zero with wse_u at or above 0.2 m catches both and removes 1. Each
      such rule is fitted to one or two passes of one year.
  - choice: CHOICE-009
    how: >
      A choice about what the lead says, made after LOOK-014 and LOOK-015. Keeping version 1's headline would have the
      lead say the gain looks above one, with [1.0043, 1.0236]. Making the low-stage step the headline would have it
      say the relation looks like a gain of one with the lowest third 0.0940 m low. Neither is supported over the
      other: with a free gain and the step together the gain is 1.0063 (plain standard error 0.0061) and the step
      -0.0644 m (plain standard error 0.0385).
  - choice: CHOICE-010
    how: >
      A choice about what to test, made after LOOK-013, LOOK-016 and LOOK-017. The other way (version 1's question)
      asks whether the gain stays inside 0.95 to 1.05, which a gain near 1.01 can hardly fail and which says nothing
      about gross errors on 2 of 52 passes. Proposing the tuned 2024 screen as the thing to test was not chosen because
      its flag part has no stated meaning in the knowledge (NOTE-005) and its other part is any of a wide range of cuts.
choices_that_would_not:
  - choice: CHOICE-001
    why: >
      Made before any look, so it cannot have moved what was seen on 2024. It decides what a test can use: the set-aside
      data has a part on the same processing as 2024 and a part on forward processing.
  - choice: CHOICE-002
    why: >
      LOOK-009: the screened gain is 1.0163, 1.0140, 1.0132 and 1.0132 at 5, 15, 30 and 60 minutes and 1.0132 with the
      gauge interpolated; the two passes that 15 minutes leaves unpaired sit -0.122 m and +0.111 m from the screened
      line.
  - choice: CHOICE-007
    why: >
      It changes the footing and not the numbers that were already there: on the 46 screened pairs the gauge-alone gain
      and its effective-sample interval in LOOK-014 are 1.0140 [1.0043, 1.0236], the same as LOOK-005, and the plain
      interval beside it is [1.0056, 1.0223]. What it did change is that the fits with extra terms now carry intervals
      of the same kind, which is why they are in CHOICE-005 and CHOICE-009 above.
pitfalls:
  - "Two vertical references: the level difference is not a bias and was not scored. recipes/swot-gauge-confrontation.md (signed by human:PaulMRamirez); gotchas/swot-gauge-datum-mismatch.md says the same for lakes and is NOT signed (a draft)."
  - "The quality flag has no stated meaning here and never reads 0. No knowledge page gives the values of reach_q for a river reach; the signed datasets/swot-lakes.md gives the lake flag as 0 good, 1 suspect, 2 degraded, 3 bad, and if the reach flag is the same every pass of 2024 is at least suspect. Not settled from the knowledge. NOTE-002, NOTE-005."
  - "Bad passes are few and are not what the flag or the stated uncertainty catches: 2 of 52, one at the lowest stage at any pass and one at high water. The file keeps gauge readings only around passes, so 'lowest' is among passes, not of the year (LOOK-013)."
  - "A reach is not a point. The reach height is an aggregate over about 10 km (gotchas/swot-reach-node-scope.md, signed) and the gauge is a point; the two differ by the surface slope times an along-river distance, and the slope rises with stage, which looks like a gain. The signed recipe gives 0.44 km and does not say to what. NOTE-006."
  - "Stage, time and reach slope move together in one year (high water early, low water late), so a gain, a drift and a low-water offset cannot be told apart on 2024 (LOOK-014, LOOK-015)."
  - "The signed recipe's worked example scores every pass; its change RMSD of 0.3823 m is carried mostly by two passes. NOTE-002, for the steward."
  - "The working file has no processing identifier, cycle, pass number, crossover quality, bitwise flag or field for how much of the reach was observed, so the processing of 2024 is taken from datasets/swot-lakes.md (signed) and the cause of either gross error cannot be read from the data. NOTE-001."
  - "Version C and Version D differ by metres at this reach and the service picks one when not told. gotchas/hydrocron-collection-default.md (signed). Only Version D was used; the collection is named in the file."
  - "The gauge is provisional throughout 2024 and may have been revised since the file was retrieved. gotchas/nwis-provisional-data.md (signed). connectors/usgs-water.md (signed) is past its stale_after date: NOTE-003."
  - "Residuals are positively autocorrelated; intervals in square brackets use a lag-1 effective sample capped at the count, as the recipe does for its own scores. Errors marked plain do not."
  - "A leak, wider than version 1 said. Before any look, texts in this repository had told this assistant about the working year: examples/baton-rouge/README.md gives an earlier run's gain and that flagged passes were left out; the docstring of mvp/confront.py states the screen itself (passes at or above a reach_q threshold excluded before pairing, because of the 2024 low-stage pass); the docstring of mvp/gain.py names the gain of satellite on gauge as the quantity, with a time term and halves of stage. So the quantity (CHOICE-003), the flag screen (CHOICE-004) and the two passes were on the page before they were looked for. The log cannot show which came first in the reasoning; nothing in this lead should be read as arrived at blind."
proposed_plan:
  question: "On the passes over reach 74210000331 after calendar 2024, with a screen written down before opening from the product description and not from what 2024 showed, is the share of kept passes whose height departs by more than 0.5 m from the gauge relation below one in twenty?"
  quantity_estimated: "The share of kept, paired passes (15 minutes, shipped executor) whose satellite height departs by more than 0.5 m from a line that needs no screen (Theil-Sen slope, median intercept, one intercept for each processing identifier), with an exact binomial interval. Reported beside it and used by no rule: the same share with no screen at all; how many passes the screen removes and how many of those were within 0.5 m; the gain from one model fixed in advance (gauge, a time term, an intercept for each processing identifier, effective-sample interval), compared with the gain that geometry predicts from the along-river distance between gauge and reach centre and not with one; the residual by rising and falling water; the recipe's change scores."
  difference_that_matters: "Nobody has stated one for gross errors. The scientist's five per cent is about the size of rise and fall and is kept for the gain reported beside. Proposed here, for the scientist to decide: a departure of more than 0.5 m is what makes a pass unusable as stage (about five times the product's stated uncertainty, and inside the gap between the two gross errors and every other pass of 2024), and more than one such pass in twenty is too many."
  rule_sketch: "Supports the idea: the upper end of the 95 per cent interval of the share is below one in twenty. Refutes it: the lower end is above one in twenty. Anything else is inconclusive, including fewer than ten pairs in a processing group, passes with no processing identifier, the executor declining, or no screen having been written down from the product description before opening. The plan stage must work out, before locking, how many kept passes the set-aside period has to hold for either end to be reachable; with about fifty passes a year and a rate near 2 in 52 this may be more than the later data at one reach can give, and then the honest plan says so or asks for further gauged reaches that have never been opened."
  prerequisites: "Three things to bring into the knowledge before a plan is written, none of which can be settled from 2024: what the values of reach_q and the bits behind it mean for RiverSP reach Version D, and which fields say a reach was partly observed (NOTE-005); the along-river distance and direction from the gauge to the reach centre, from SWORD and the site file (NOTE-006); and a working file that carries the processing identifier, cycle and pass, the bitwise flag and the crossover calibration quality for each pass (NOTE-001). The screen is then the steward's and the scientist's to write, from the product description."
  hard_cases: "A flagged gross error at low stage; an unflagged gross error at high water with a large stated uncertainty; an unflagged gross error with an ordinary stated uncertainty and an ordinary slope, which no rule seen in 2024 would catch; a year in which every pass carries a non-zero flag; a screen that removes mostly ordinary passes; an offset step between processing identifiers; a slow drift; a low-water offset with a gain of exactly one; a gauge several kilometres from the reach centre with a slope that rises with stage; a loop between rising and falling water; residual autocorrelation; gauge readings only hourly around some passes; a datum offset of any size, which must move neither the share nor the gain; gross errors numerous enough to pull an ordinary least squares line, which the line that needs no screen must withstand."
  what_this_could_not_show: "One reach and one gauge on a leveed lower river: nothing about reaches with no gauge, which is the scientist's real purpose, and there no threshold can be tuned on a departure. A low share would not say the level can be used, since the datum offset stays uncited. It would not say why the screened pairs of 2024 sit 1.4 per cent steep; a second year in which high and low water fall at other times of year, and the gauge's position in the reach, are what could separate a gain from a drift, a low-water offset and geometry. It would not say what went wrong on the two passes of 2024. If the gauge stays provisional, a later revision could move the answer."
