# DRAFT analysis plan for study STUDY-0002, started from the hand-over of EXPLORATION-0001. Nothing here is
# locked: the scientist and the steward lock it together, and no assistant does. It takes the method, the tests
# and the criteria from the package's first study (mvp/studies/STUDY-0001), which asks the same question, and
# takes from the lead the choices to fix, the pitfalls and the limits. Every key is explained in
# mvp/templates/analysis-plan.yaml.
study: STUDY-0002
question: "Over the first full year of forward processing (2025-04-28 to 2026-04-27), does SWOT reach water surface elevation at Baton Rouge rise and fall by the same amount as the gauge, to within five percent?"
claim_class: variability      # from the organization's closed claim-class vocabulary
quantity_estimated: >
  The average gain over the window's stage distribution: the coefficient on
  gauge elevation when satellite elevation is regressed on gauge elevation
  and on time across paired passes (pairing tolerance 15 minutes, collection
  named, passes flagged degraded or worse excluded before pairing), with a
  95 percent sampling interval under a lag-1 model of the residuals. The
  intercept absorbs the uncited offset between the two vertical references
  and the time term absorbs slow drift, so the gain is insensitive to both.
  It is one number for the year: gains for the lower and upper half of
  stage are reported beside it and no rule uses them.

roots:                      # relative to this study directory
  kit: ../../../../mvp
  hydrology: ../../../../../hydrology
  knowledge_tools: ../../../../../nasa-daac-knowledge/tools

code:                       # locked by checksum, with everything Python could import from the folder of each of these
  - "{hydrology}/skills/swot-hydro/scripts/load_swot_confrontation.py"
  - "{kit}/gain.py"
  - "{kit}/confront.py"
  - "{kit}/test_cases.py"

data:
  working: "Calendar 2024, committed fixture swot_gauge_baton_rouge_2024.json: explored in EXPLORATION-0001 and EXPLORATION-0002 (29 and 4 looks), already seen, never held out. Taken to be the reprocessed baseline on the word of the signed knowledge; the fixture carries no processing identifier."
  held_out:
    window: {start: "2025-04-28", end: "2026-04-27"}
    why_this_window: >
      The hydrology bundle records, in its SWOT lake dataset concept and
      for this Version D family, that forward processing begins on
      2025-04-28; its river concept records the same two processing
      identifiers. A calendar 2025 window would straddle that change; this
      one is a full annual cycle on one baseline, none of it read by this
      project. The fetch of observation metadata confirms the identifier
      of every pass at this reach before the lock.
    # the subject: the record of what has been opened matches studies by this and by the window, never by the study's id
    pair: {reach_id: "74210000331", gauge: "USGS-07374000", collection: SWOT_L2_HR_RiverSP_reach_D}
    withheld_values: [wse, wse_u]      # satellite elevations: read by nobody before the opening
    observation_metadata: [pass times, pass count, reach_q, crid, gauge stage, approval status]
    metadata_note: >
      Observation metadata are values that cannot move the answer whatever the withheld values
      turn out to be, once every choice in the analysis is fixed. They may be read before the
      lock to size the experiment: the known-answer tests are built on them, so its power is the
      power of the experiment that will run. Pass times, the pass count, reach_q and crid pass
      that test as they stand. Gauge stage and its approval status are on the list by a decision
      made for this plan, not as a general rule, and they qualify on one condition: the quality
      screen (reach_q), the pairing (the tolerance in minutes) and the model of the gain are
      fixed in this plan and its code before the window's gauge record is fetched, so the gauge
      record alone, without the satellite elevations, cannot move the gain. If any of those
      three is still open when the gauge record would be fetched, the gauge record is withheld
      with the satellite elevations. Until the observation metadata are fetched for this window,
      the 2024 fixture stands in as the sampling.
    path: data/swot_gauge_baton_rouge_fwd_y1.json

tests:
  known-answers:   # known-answer tests on the real sampling: can the method recover what was put in, and can the rule fail?
    command: ["{python}", "{kit}/known_answer_tests.py",
              "--executor", "{hydrology}/skills/swot-hydro/scripts/load_swot_confrontation.py",
              "--plan", "{study}/analysis-plan.yaml",
              "--sampling", "{hydrology}/verification/fixtures/confrontation/swot_gauge_baton_rouge_2024.json",
              "--cases", "2000", "--difference-that-matters", "0.05", "--screen-reach-q", "2",
              "--out", "{study}/receipts/known-answers.json"]
    receipt: receipts/known-answers.json
  working-data:   # working data: the same code on the window already seen
    command: ["{python}", "{kit}/confront.py",
              "--executor", "{hydrology}/skills/swot-hydro/scripts/load_swot_confrontation.py",
              "--inputs", "{hydrology}/verification/fixtures/confrontation/swot_gauge_baton_rouge_2024.json",
              "--screen-reach-q", "2", "--out", "{study}/receipts/working-data.json"]
    receipt: receipts/working-data.json
  held-out:   # the opening of the held-out data: fetched and run by the access gate, once
    # the fetch is told the folder and a label; it writes data/swot_gauge_baton_rouge_fwd_y1.json, the path planned above
    fetch: ["uv", "run", "{hydrology}/verification/fixtures/fetch_confrontation_fixtures.py",
            "--reach", "74210000331", "--gauge", "07374000",
            "--start", "2025-04-28", "--end", "2026-04-27",
            "--label", "baton_rouge_fwd_y1", "--out", "{study}/data"]
    command: ["{python}", "{kit}/confront.py",
              "--executor", "{hydrology}/skills/swot-hydro/scripts/load_swot_confrontation.py",
              "--inputs", "{study}/data/swot_gauge_baton_rouge_fwd_y1.json",
              "--screen-reach-q", "2", "--require-crid", "--refusal-is-a-result",
              "--out", "{study}/receipts/held-out.json"]
    receipt: receipts/held-out.json

rehearsals:   # rehearsals on working data; the lock is refused until each has passed on the locked plan and code
  - id: opening-path
    why: "the one opening must not be spent finding out that the fetch, the identifier capture or the receipt never worked"
    steps:
      - ["uv", "run", "{hydrology}/verification/fixtures/fetch_confrontation_fixtures.py",
         "--reach", "74210000331", "--gauge", "07374000", "--start", "2024-01-01", "--end", "2024-12-31",
         "--label", "rehearsal_2024", "--out", "{study}/rehearsal"]
      - ["{python}", "{kit}/confront.py",
         "--executor", "{hydrology}/skills/swot-hydro/scripts/load_swot_confrontation.py",
         "--inputs", "{study}/rehearsal/swot_gauge_rehearsal_2024.json",
         "--screen-reach-q", "2", "--require-crid", "--out", "{study}/receipts/rehearsal-opening-path.json"]
    receipt: receipts/rehearsal-opening-path.json
    writes: [rehearsal/swot_gauge_rehearsal_2024.json]     # what the rehearsal's own fetch writes; removed before each run, not locked
  - id: finding-form
    why: "a receipt the findings checker cannot bind cannot be repaired after the lock, so a rehearsal finding drafted from the 2024 receipt passes it first"
    needs: ["{hydrology}/knowledge/findings/rehearsal-swot-gauge-gain-2024.md"]   # the tool looks for it before any step runs, and the lock binds it
    steps:
      - ["uv", "run", "{knowledge_tools}/check_okf_v02.py", "{hydrology}/knowledge", "--findings"]

rules:
  - id: gain-equivalence
    role: primary
    statement: "The gain is within five percent of one."
    supported_if:
      - {field: gain.ci_low, op: ">=", value: 0.95}
      - {field: gain.ci_high, op: "<=", value: 1.05}
    refuted_if:
      - [{field: gain.ci_high, op: "<", value: 0.95}]
      - [{field: gain.ci_low, op: ">", value: 1.05}]
    # anything else is inconclusive; inconclusive is a result and is final for this window
    power_evidence:
      path: rules.gain-equivalence
      require:     # the criteria the known-answer tests must meet before the lock; the tool requires the four marked
        - {field: coverage_when_true, op: ">=", value: 0.90}             # required
        - {field: coverage_min_over_hard_cases, op: ">=", value: 0.90}
        - {field: false_confirm_at_edge_max, op: "<=", value: 0.05}      # required
        - {field: false_refute_at_edge_max, op: "<=", value: 0.05}       # required
        - {field: power_to_support_when_true, op: ">=", value: 0.80}
        - {field: power_to_refute_when_false, op: ">=", value: 0.80}     # required
        - {field: false_confirm_when_false, op: "<=", value: 0.01}
        - {field: processing_change_refused_rate, op: ">=", value: 1.0}

openings_allowed: {held-out: 1}

planned_handling:
  quality: "Passes with reach_q at or above 2 are excluded before pairing; the count is reported."
  processing: "A window that mixes processing identifiers, or lacks one for any pass, is declined."
  declined: "If the locked method declines to estimate, the outcome is inconclusive."
  one_opening_per_window: "A later study on this pair and an overlapping window is exploratory."

independence: >
  To be stated at the plan stage with a source: whether any gauge record enters the
  satellite product's processing or calibration at this reach. The claim's
  strength depends on the answer and the finding repeats it.

what_this_can_show: >
  Temporal replication at one pair: whether the relation seen in 2024 holds
  in a later year on the forward-processing baseline. Predicted from 2024
  alone the opening is likely to come back supported (the known-answer tests' power curve says
  how likely), so a supported outcome is modest evidence; the interval,
  not the verdict, is the finding. It cannot show which instrument is
  right, and it says nothing about other reaches.

overturn: >
  An interval for the window lying wholly outside 0.95 to 1.05 refutes the
  claim. A later window or a reprocessed collection whose interval leaves
  the band supersedes a supported finding. A cited datum relationship
  would let the level be scored and could change what the gain is read to
  mean.

limitations:
  - "One reach, one gauge, one year; nothing is claimed elsewhere."
  - "The window differs from the explored year in two ways at once, the year and the processing baseline, so a result that differs from 2024 cannot say which of the two changed (the lead's stated limit, from its review)."
  - "The quality screen rests on the signed dataset page calling reach_q a gate and, in 2024, on one flagged pass in three being far off; one unflagged pass with a high dark fraction was also far off and is not screened (the lead, CHOICE-003 and CHOICE-005)."
  - "The gauge values in the window may be provisional."
  - "The interval is a sampling interval; it carries neither instrument's published uncertainty."
  - "The gain is an average over the year's stage distribution; a relation that bends with stage is averaged, and the two half-stage gains are reported so a reader can see it."
  - "Errors at low stage that the product does not flag would bias the gain and are not detectable by this method (known-answer tests, beyond-limits cases)."
  - "The five percent difference that matters is a judgment the scientist and the steward own, not a requirement anyone has stated. One year at this reach resolves it with at least eighty percent power in the kind case only: on the 2024 sampling the known-answer tests support a true gain of one in 0.9465 of cases when nothing else is wrong, in 0.6175 of cases with autocorrelated error, and in 0.4895 of cases with unflagged gross errors, the worst case the plan requires (2000 cases, seed 20261125; recomputed on this window's own observation metadata at the plan stage). In that worst case a true idea comes back inconclusive about half the time, and never refuted."

scheduled_retest:
  next_window: "2026-04-28 to 2027-04-27, after the window closes"
  trigger: "a new window or a new collection version; started as a fresh study that cites this one"
