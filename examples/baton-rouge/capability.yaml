# The `capability` block of factory/factory.yaml, filled in for a real
# capability: the hydrology capability of Open Science Pillars. To run this
# demo as a factory of that capability, copy the definition (the folder
# factory/) into the capability's own repository and put this block in place
# of the built-in one in its factory.yaml.
# The study tool does not read this block; it is for people.
capability:
  name: "the hydrology capability"
  repositories: [hydrology]                    # a factory spanning several capabilities lists several
  borrows: [core, nasa-daac-knowledge]         # read by this factory, never written by it
  stewards: "the capability's code owners"
  holds: {studies: "studies/", record_of_openings: "studies/openings.jsonl", change_log: "factory/change-log.jsonl"}
